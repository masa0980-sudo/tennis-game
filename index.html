<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コート・ラリー</title>
<style>
  :root{
    color-scheme: dark;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --danger:#f87171;
    --good:#34d399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0b1020; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
  #app{ position:relative; min-height:100dvh; width:100%; overflow:hidden; touch-action:none; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center; }
  .screen.active{ display:flex; }

  h1{ font-size:28px; margin:0; letter-spacing:.02em; }
  .sub{ color:#9aa4c4; font-size:13px; margin:0; }

  /* 10人ぶんが縦に収まるよう、5列のグリッドにする(狭い画面では4列) */
  .charRow{ display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;
    width:100%; max-width:420px; }
  @media (max-width:380px){ .charRow{ grid-template-columns:repeat(4, 1fr); } }
  .charBtn{ background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14);
    border-radius:14px; padding:6px 2px 5px; display:flex; flex-direction:column; align-items:center;
    gap:2px; cursor:pointer; color:#fff; }
  .charBtn .charArt{ display:block; width:100%; max-width:56px; aspect-ratio:1; position:relative; }
  .charBtn .charArt img, .charBtn .charArt svg{ width:100%; height:100%; object-fit:contain; display:block;
    image-rendering:-webkit-optimize-contrast; }
  .charBtn .svgRacket{ display:none; }
  .charBtn.selected{ border-color:var(--accent); box-shadow:0 0 18px rgba(56,189,248,.4);
    background:rgba(56,189,248,.12); }
  .charBtn .cname{ font-size:10px; font-weight:700; line-height:1.2; word-break:keep-all; }

  .bigBtn{ padding:16px 40px; border-radius:16px; border:none; font-size:18px; font-weight:800;
    color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 24px rgba(56,189,248,.4); cursor:pointer; }
  .bigBtn:active{ transform:scale(.96); }
  .ghostBtn{ padding:10px 22px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05); color:#fff; font-size:14px; cursor:pointer; }
  .h2{ font-size:22px; }

  /* ===== モード選択 ===== */
  .modeList{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px; }
  .modeBtn{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left;
    padding:16px 18px; border-radius:16px; border:2px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06); color:#fff; cursor:pointer; }
  .modeBtn b{ font-size:18px; }
  .modeBtn span{ font-size:12px; color:#9aa4c4; }
  .modeBtn em{ font-style:normal; font-size:11px; color:#7dd3fc; }
  .modeBtn:not([disabled]):active{ transform:scale(.98); }
  .modeBtn[disabled]{ opacity:.45; cursor:default; }

  /* ===== トーナメントのラダー ===== */
  .ladderList{ display:flex; flex-direction:column-reverse; gap:8px; width:100%; max-width:360px; }
  .ladderRow{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); text-align:left; }
  .ladderArt{ position:relative; width:44px; height:44px; flex:none; }
  .ladderArt img, .ladderArt svg{ width:100%; height:100%; object-fit:contain; display:block; }
  .ladderArt .svgRacket{ display:none; }
  .ladderRow .info{ flex:1; min-width:0; }
  .ladderRow .name{ font-weight:800; font-size:14px; }
  .ladderRow .desc{ font-size:11px; color:#9aa4c4; }
  .ladderRow .state{ font-size:11px; color:#fde68a; }
  .ladderRow.locked{ opacity:.45; }
  .ladderRow.locked .ladderArt{ filter:brightness(0) opacity(.5); }
  .ladderRow .fightBtn{ padding:8px 14px; border-radius:10px; border:none; font-weight:800;
    color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2)); cursor:pointer; flex:none; }
  .ladderRow.locked .fightBtn{ display:none; }
  .ladderRow.beaten .name::after{ content:" ✓"; color:var(--good); }
  .resultBtns{ display:flex; flex-direction:column; gap:10px; align-items:center; }

  /* ===== プレイ画面 ===== */
  #play{ justify-content:space-between; padding:12px 10px 16px; gap:8px; }
  .hud{ display:flex; justify-content:space-between; align-items:center; width:100%; max-width:460px;
    font-variant-numeric:tabular-nums; font-size:12px; color:#9aa4c4; }
  .hud b{ color:#fff; font-size:26px; display:block; line-height:1.1; }
  .hud .you b{ color:#7dd3fc; }
  .hud .cpu{ text-align:right; }
  .hud .cpu b{ color:#f0abfc; }
  .hud .mid{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .vsName{ font-size:11px; color:#9aa4c4; }
  .rallyCount{ font-size:11px; letter-spacing:.14em; font-weight:800; color:#cbd5e1; }

  /* 必殺ゲージ。満タンで発光し、次のperfect/goodが自動でスマッシュになる */
  .gauge{ display:flex; align-items:center; gap:8px; width:100%; max-width:460px; }
  .gaugeTrack{ flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; }
  .gaugeFill{ height:100%; width:0%; border-radius:999px; transition:width .25s ease-out;
    background:linear-gradient(90deg, #f59e0b, #fde68a); }
  .gaugeLabel{ flex:none; font-size:10px; letter-spacing:.14em;
    font-weight:800; color:#fde68a; opacity:.5; }
  .gauge.full .gaugeFill{ background:linear-gradient(90deg,#fb7185,#fde68a,#fb7185); background-size:200% 100%;
    animation:gaugeShine .8s linear infinite; box-shadow:0 0 14px rgba(253,230,138,.8); }
  .gauge.full .gaugeLabel{ opacity:1; animation:blink .5s steps(2) infinite; }
  @keyframes gaugeShine{ from{ background-position:0 0; } to{ background-position:200% 0; } }
  @keyframes blink{ to{ opacity:.3; } }
  .rallyCount b{ font-size:14px; display:inline; color:#fff; margin-left:4px; }
  .deuceNote{ font-size:11px; font-weight:800; letter-spacing:.08em;
    color:#fde68a; padding:2px 10px; border-radius:999px; background:rgba(253,230,138,.14);
    border:1px solid rgba(253,230,138,.4); }
  .deuceNote[hidden]{ display:none; }

  /* テニスコート風の背景。芝(グリーン)の地に、シングルスのサイドライン・
     サービスラインを白線で描く。実寸どおりの比率ではなく、あくまで
     「テニスコートらしく見える」ことを優先した簡略デザイン */
  /* 縦長(2:3)を保つ: 高さ(flex:1で残り空間)から幅を導く。横長で低い画面でも
     コートが横長にならない。幅が画面に収まらない時だけ max-width で詰める */
  .court{ position:relative; flex:1; min-height:0; width:auto; aspect-ratio:2/3;
    max-width:min(460px, 100%); margin:0 auto;
    background:
      linear-gradient(transparent 0 30%, rgba(255,255,255,.4) 30% calc(30% + 2px), transparent calc(30% + 2px) 100%),
      linear-gradient(transparent 0 70%, rgba(255,255,255,.4) 70% calc(70% + 2px), transparent calc(70% + 2px) 100%),
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.4) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 30% / 100% 40% no-repeat,
      linear-gradient(90deg,
        transparent 0 10%, rgba(255,255,255,.55) 10% calc(10% + 2px), transparent calc(10% + 2px) 90%,
        rgba(255,255,255,.55) 90% calc(90% + 2px), transparent calc(90% + 2px) 100%),
      linear-gradient(180deg, var(--grassA, #1f6b4f), var(--grassB, #1c6349) 40%, var(--grassC, #14432f));
    border:3px solid rgba(255,255,255,.6); border-radius:14px; overflow:hidden; cursor:pointer;
    user-select:none; -webkit-user-select:none; }
  /* アンロックで選べるコートの色(背景のグラデーションだけを差し替える) */
  .court[data-theme="hard"]{ --grassA:#2563a8; --grassB:#1f5799; --grassC:#123a6b; }
  .court[data-theme="clay"]{ --grassA:#b4643a; --grassB:#a55631; --grassC:#6f3a20; }
  .court[data-theme="night"]{ --grassA:#243b6b; --grassB:#1b2d55; --grassC:#101b36; }
  .netLine{ position:absolute; left:6%; right:6%; top:48%; height:6px; margin-top:-3px;
    background:
      repeating-linear-gradient(90deg, rgba(10,20,15,.9) 0 6px, transparent 6px 7px),
      linear-gradient(#fff, #fff) top / 100% 2px no-repeat,
      #0d1f17;
    box-shadow:0 2px 4px rgba(0,0,0,.4); z-index:2; }

  .ballShadow{ position:absolute; width:22px; height:8px; margin-left:-11px; margin-top:-4px;
    border-radius:50%; background:rgba(0,0,0,.35); filter:blur(1px); z-index:3; }
  .ball{ position:absolute; width:22px; height:22px; margin-left:-11px; margin-top:-11px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #ffd54a 55%, #f3a712 100%);
    box-shadow:0 0 10px rgba(255,213,74,.7); z-index:4; transition: box-shadow .08s; }
  .ball.hidden{ opacity:0; }
  /* 「今タップすれば当たる」瞬間だけ強く光る(判定式と同じ条件で点灯させる) */
  .ball.ready{ box-shadow:0 0 4px 2px #fff, 0 0 22px 9px rgba(255,213,74,.95); }
  /* アンロックで選べるボールの色 */
  .ball[data-skin="gold"]{ background:radial-gradient(circle at 35% 30%, #fff, #ffe9a3 45%, #d4a017 100%);
    box-shadow:0 0 12px rgba(255,215,0,.85); }
  .ball[data-skin="neon"]{ background:radial-gradient(circle at 35% 30%, #fff, #7dffd4 45%, #12b886 100%);
    box-shadow:0 0 14px rgba(45,255,196,.9); }

  /* ヒット時の粒(プールから使い回す) */
  .spark{ position:absolute; width:7px; height:7px; margin:-3px 0 0 -3px; border-radius:50%;
    background:#fff; z-index:6; pointer-events:none; opacity:0; }
  .spark.fly{ animation: sparkFly .42s ease-out forwards; }
  @keyframes sparkFly{
    from{ opacity:1; transform:translate(0,0) scale(1); }
    to{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.3); }
  }

  /* 実績解除のトースト */
  #toasts{ position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{ display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px;
    background:rgba(15,23,42,.95); border:1px solid rgba(253,230,138,.55);
    box-shadow:0 6px 20px rgba(0,0,0,.5); animation:toastIn .3s ease-out; }
  .toast b{ font-size:10px; letter-spacing:.12em; color:#fde68a; }
  .toast span{ font-size:13px; font-weight:800; }
  .toast.out{ animation:toastOut .35s ease-in forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-12px); } to{ opacity:1; transform:none; } }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(-12px); } }

  /* ===== 実績画面 ===== */
  .achList{ display:flex; flex-direction:column; gap:6px; width:100%; max-width:360px;
    max-height:44vh; overflow-y:auto; }
  .achRow{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); text-align:left; }
  .achRow .mark{ flex:none; width:22px; text-align:center; font-size:14px; }
  .achRow .name{ font-weight:800; font-size:13px; }
  .achRow .desc{ font-size:11px; color:#9aa4c4; }
  .achRow.locked{ opacity:.45; }
  .achRow.got{ border-color:rgba(253,230,138,.45); }
  .achRow.got .mark{ color:#fde68a; }
  .equipRow{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; width:100%; max-width:360px; }
  .chip{ padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; color:#fff;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); }
  .chip.on{ border-color:var(--accent); background:rgba(56,189,248,.18); font-weight:800; }
  .chip[disabled]{ opacity:.4; cursor:default; }
  .equipTitle{ font-size:11px; letter-spacing:.1em; color:#9aa4c4; margin:0; }

  /* 自分の「打てる範囲」バー。ボールが自分に向かう間だけ薄く見え、
     実際にタップすればヒットする瞬間だけ明るく光って脈打つ */
  .hitZone{ position:absolute; bottom:3.5%; width:34%; max-width:170px; height:12px;
    margin-left:-17%; border-radius:999px; z-index:1; pointer-events:none;
    background:rgba(255,255,255,.12); opacity:0; transition:opacity .15s, background .1s, box-shadow .1s; }
  .hitZone.visible{ opacity:1; }
  .hitZone.ready{ background:linear-gradient(90deg, rgba(56,189,248,.5), #7dd3fc, rgba(56,189,248,.5));
    box-shadow:0 0 18px rgba(56,189,248,.85); animation:hitZonePulse .3s ease-in-out infinite alternate; }
  @keyframes hitZonePulse{ from{ transform:scaleY(1); } to{ transform:scaleY(1.5); } }

  .charWrap{ position:absolute; z-index:5; }
  /* ポーズ(idle/run/swing)は画像の差し替え、向きは .body の --flip(1=左向き/-1=右向き)。
     素材は左向きに描かれているので右へ向く時だけ反転する。反転を img ではなく .body に
     付けるのは、img の transform transition が scaleX(0) を経由して一瞬ペラペラになるため */
  .charWrap .body{ position:relative; transform: scaleX(var(--flip, 1)) rotate(var(--lean, 0deg));
    transition: transform .18s; }
  /* テル(相手の予備動作): 狙う側へ体を傾ける(--lean)、強打の前は縮んで赤い輪(.charge) */
  .charWrap.charge img, .charWrap.charge .body > svg{ animation: chargePulse .18s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 10px rgba(248,113,113,.95)); }
  @keyframes chargePulse{ from{ transform:scale(.9); } to{ transform:scale(.97); } }
  /* ネットラッシャーの前進。相手の打点(top)がネット際まで下りる */
  .opponentWrap{ transition: top .45s ease-out; }
  .court.shake{ animation: shake .25s linear; }
  @keyframes shake{ 0%,100%{ transform:translate(0,0); } 20%{ transform:translate(-4px,2px); }
    40%{ transform:translate(4px,-2px); } 60%{ transform:translate(-3px,-2px); } 80%{ transform:translate(3px,2px); } }
  @media (prefers-reduced-motion: reduce){ .court.shake{ animation:none; } }
  .charWrap img, .charWrap .body > svg{ width:96px; height:auto; display:block; transition: transform .12s; }
  .charWrap[data-pose="run"] img, .charWrap[data-pose="run"] .body > svg{
    animation: runBob .22s ease-in-out infinite alternate; }
  @keyframes runBob{ from{ margin-top:0; } to{ margin-top:-6px; } }
  .charWrap.hit img, .charWrap.hit .body > svg{ transform: scale(1.12) rotate(-4deg); animation:none; }
  .charWrap.miss img, .charWrap.miss .body > svg{ transform: scale(.92) rotate(8deg); filter:grayscale(.5); animation:none; }
  .charWrap.whiff img, .charWrap.whiff .body > svg{ transform: rotate(-14deg); animation:none; }

  /* SVGで描いたキャラは絵にラケットが無いので、別途ラケットを重ねる
     (PNGのキャラは絵に描かれているので renderCharInto 側で付けない) */
  .charWrap .svgRacket{ position:absolute; width:26px; height:44px; right:-6px; bottom:24%;
    transform-origin:50% 92%; transform:rotate(26deg); transition:transform .16s cubic-bezier(.2,1.4,.4,1);
    pointer-events:none; }
  .charWrap .svgRacket svg{ width:100%; height:100%; display:block; }
  .charWrap[data-pose="swing"] .svgRacket{ transform:rotate(-92deg); }

  .playerWrap{ bottom:0.5%; transform:translateX(-50%); }
  .playerWrap img, .playerWrap .body > svg{ width:108px; }

  .opponentWrap{ top:0.5%; transform:translateX(-50%); }
  .opponentWrap img, .opponentWrap .body > svg{ width:90px; }

  /* 判定ポップ(PERFECT! / GOOD / EARLY / LATE / 空振り) */
  .judgePop{ position:absolute; z-index:7; transform:translate(-50%,0); font-weight:900; font-size:18px;
    letter-spacing:.04em; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.55);
    animation: popUp .65s ease-out forwards; white-space:nowrap; }
  .judgePop.perfect{ font-size:23px; color:#fff7c2;
    text-shadow:0 0 12px rgba(253,230,138,.9), 0 2px 6px rgba(0,0,0,.55); }
  .judgePop.good{ color:#7dd3fc; }
  .judgePop.ok{ color:#fde68a; font-size:15px; }
  .judgePop.whiff{ color:#fca5a5; font-size:15px; }
  .judgePop.out{ color:#fb923c; font-size:22px; }
  .judgePop.smash{ color:#fda4af; font-size:24px; text-shadow:0 0 14px rgba(251,113,133,.9), 0 2px 6px rgba(0,0,0,.55); }
  @keyframes popUp{
    0%{ opacity:0; transform:translate(-50%,10px) scale(.8); }
    15%{ opacity:1; transform:translate(-50%,0) scale(1.12); }
    100%{ opacity:0; transform:translate(-50%,-44px) scale(1); }
  }

  .tapHint{ font-size:12px; color:#9aa4c4; margin:0; }
  .hintDir{ display:inline-block; padding:0 3px; opacity:.5; transition:opacity .15s, color .15s; }
  .hintDir.lit{ opacity:1; color:var(--accent); text-shadow:0 0 8px rgba(56,189,248,.8); }

  .flash{ position:absolute; inset:0; pointer-events:none; opacity:0; z-index:6; }
  .flash.good{ background:rgba(52,211,153,.18); }
  .flash.bad{ background:rgba(248,113,113,.22); }
  .flash.show{ animation: flashOut .3s ease-out; }
  @keyframes flashOut{ from{ opacity:1; } to{ opacity:0; } }

  #result .rank{ font-size:40px; font-weight:900; margin:0; }
  #result .score{ font-size:15px; color:#9aa4c4; }
  #result .score b{ color:#fff; font-size:28px; }
  #result .stats{ font-size:12px; color:#9aa4c4; margin:0; }
  #result .stats b{ color:#fff; }
  #result .resultSub{ margin:0; font-size:13px; color:#9aa4c4; }
  #result[data-mode="rally"] .matchOnly{ display:none; }
  #result[data-mode="tournament"] .rallyOnly{ display:none; }
  .bigScore{ font-size:44px; font-weight:900; margin:0; font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#fde68a,#fb923c); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .bestLine{ font-size:12px; color:#fde68a; margin:0; min-height:1em; }

  /* ===== みんなのランキング(Rhythm_game から移植) ===== */
  .rankBox{ width:100%; max-width:340px; padding:12px 14px; border-radius:14px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); }
  .rankTitle{ font-size:12px; letter-spacing:.1em; color:#9aa4c4; margin-bottom:6px; }
  #rankList{ list-style:none; margin:0; padding:0; font-size:13px; line-height:1.9;
    max-height:190px; overflow-y:auto; }
  #rankList li{ display:flex; align-items:center; gap:8px; padding:2px 0; }
  #rankList .rankNo{ width:1.6em; flex:none; opacity:.6; font-weight:800; text-align:right; }
  #rankList .rankInit{ flex:1; font-weight:800; letter-spacing:.08em; color:var(--accent2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  #rankList .rankScore{ flex:none; font-variant-numeric:tabular-nums; opacity:.9; }
  #rankList .rankEmpty{ opacity:.6; justify-content:center; }
  #rankEntry{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed rgba(255,255,255,.18); }
  #rankEntry.show{ display:block; }
  .rankCongrats{ font-size:12px; color:#fde68a; margin-bottom:6px; }
  #rankInitials{ width:100%; padding:11px 12px; border-radius:9px; margin-bottom:8px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); color:#fff;
    font-size:16px; text-align:center; letter-spacing:.1em; }
  #rankInitials:focus{ outline:none; border-color:var(--accent); }
  #rankSubmitBtn{ width:100%; padding:11px; border-radius:10px; border:none; font-weight:800;
    color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2)); cursor:pointer; }
  #rankSubmitBtn:disabled{ opacity:.6; cursor:default; }
  #rankStatus{ font-size:11.5px; line-height:1.7; opacity:.8; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= タイトル(キャラクター選択) ================= -->
  <section id="title" class="screen active">
    <h1>コート・ラリー</h1>
    <p class="sub">タイミングよくタップ。スワイプでコースを打ち分けよう。</p>
    <div class="charRow" id="charRow"></div>
    <button class="bigBtn" id="startBtn">はじめる</button>
    <button class="ghostBtn" id="achBtn">実績 0/12</button>
    <p class="tapHint">タップ / スペースで打つ　・　◀ ▲ ▶ スワイプ / 矢印キーでコース</p>
  </section>

  <!-- ================= 実績とアンロック ================= -->
  <section id="achievements" class="screen">
    <span class="sub">ACHIEVEMENTS</span>
    <h1 class="h2" id="achTitle">実績</h1>
    <div class="achList" id="achList"></div>
    <p class="equipTitle">コート</p>

          autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">

<script>
(function(){
  "use strict";

  /* =========================================================
     0. 小道具
     ========================================================= */
  function $(id){ return document.getElementById(id); }
  const SCREENS = ["title","modes","ladder","play","result","achievements"];
  function show(id){
    SCREENS.forEach(function(s){
      $(s).classList.toggle("active", s === id);
    });
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t){ return a + (b - a) * t; }

  /* =========================================================
     1. Sfx — Web Audio API で音を生成する(外部音源ファイル不要)。
        Rhythm_game の Sfx から unlock/tone を移植し、テニス用の効果音を足した。
     ========================================================= */
  const Sfx = (function(){
    let ctx = null, master = null;
    function ensure(){
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.35;
        master.connect(ctx.destination);
      }
      return ctx;
    }
    // ユーザー操作(ボタン押下)内で呼び、自動再生制限を解除する
    function unlock(){
      const c = ensure();
      if (c && c.state === "suspended") c.resume();
      return c;
    }
    function unlockJingle(){
      const t = nowT();
      tone(t,        { type:"sine", freq:1568, dur:0.14, peak:0.22 });
      tone(t + 0.11, { type:"sine", freq:2093, dur:0.2,  peak:0.2 });
    }
    function tone(at, opt){
      const c = ensure();
      if (!c) return;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = opt.type || "sine";
      osc.frequency.setValueAtTime(opt.freq, at);
      if (opt.freqEnd != null) osc.frequency.exponentialRampToValueAtTime(opt.freqEnd, at + opt.dur);
      const peak = opt.peak != null ? opt.peak : 0.25;
      const dur  = opt.dur  != null ? opt.dur  : 0.08;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(peak, at + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(g); g.connect(master);
      osc.start(at);
      osc.stop(at + dur + 0.03);
    }
    function nowT(){ const c = ensure(); return c ? c.currentTime : 0; }
    const now = nowT;

    function hit(tier){
      const t = now();
      if (tier === "perfect") {
        tone(t,        { type:"sine", freq:1046.5, dur:0.16, peak:0.3 });
        tone(t + 0.03, { type:"sine", freq:1318.5, dur:0.16, peak:0.24 });
      } else if (tier === "good") {
        tone(t, { type:"sine", freq:880, dur:0.14, peak:0.26 });
      } else {
        tone(t, { type:"triangle", freq:520, dur:0.09, peak:0.18 });
      }
    }
    function whiff(){ tone(now(), { type:"sawtooth", freq:220, freqEnd:120, dur:0.18, peak:0.2 }); }
    function bounce(){ tone(now(), { type:"sine", freq:180, dur:0.05, peak:0.14 }); }
    function smash(){
      const t = now();
      tone(t, { type:"square",   freq:160,  freqEnd:60,  dur:0.2,  peak:0.3 });
      tone(t, { type:"sawtooth", freq:1200, freqEnd:300, dur:0.16, peak:0.14 });
    }
    function charge(){ tone(now(), { type:"sine", freq:330, freqEnd:520, dur:0.16, peak:0.12 }); }
    function pointWin(){
      const t = now();
      [660, 880, 1320].forEach(function(f, i){ tone(t + i * 0.09, { type:"sine", freq:f, dur:0.14, peak:0.22 }); });
    }
    function pointLose(){
      const t = now();
      tone(t,        { type:"triangle", freq:440, dur:0.14, peak:0.2 });
      tone(t + 0.12, { type:"triangle", freq:330, dur:0.2,  peak:0.18 });
    }
    function win(){
      const t = now();
      [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(t + i * 0.12, { type:"sine", freq:f, dur:0.22, peak:0.26 }); });
    }
    function lose(){
      const t = now();
      tone(t,        { type:"triangle", freq:392, dur:0.25, peak:0.22 });
      tone(t + 0.22, { type:"triangle", freq:311, dur:0.4,  peak:0.2 });
    }
    function state(){ return ctx ? ctx.state : "none"; }

    return { unlock, unlockJingle, hit, whiff, bounce, smash, charge, pointWin, pointLose, win, lose, state };
  })();

  /* =========================================================
     2. Court / Rng — 座標系と差し替え可能な乱数(DOM非依存)
        論理X座標は0〜100。見切れないよう、CSS上は15%〜85%の帯に写像する。
        前後移動は無く(=奥行きは今回のスコープ外)、左右だけを扱う。
     ========================================================= */
  const Court = {
    X_MIN: 0, X_MAX: 100,
    CSS_MIN: 10, CSS_MAX: 90,   // 背景のサイドライン(10%〜90%)いっぱいまで使う
    PLAYER_Y: 92,     // 自分の打点(コート下端寄り、%)
    OPPONENT_Y: 5,    // 相手の打点(コート上端寄り、%)
    toCssX: function(x){ return Court.CSS_MIN + (Court.CSS_MAX - Court.CSS_MIN) * (x / 100); },
  };
  let rand = Math.random;
  function setRng(fn){ rand = (typeof fn === "function") ? fn : Math.random; }

  /* =========================================================
     3. Scoring — 本物のテニス採点(0/15/30/40、デュース/アドバンテージ)。
        DOMに触れない純粋関数。セット・マッチはスコープ外(1ゲームの勝敗のみ)。
     ========================================================= */
  function scoreLabels(pointsFor, pointsAgainst){
    if (pointsFor >= 4 && pointsFor - pointsAgainst >= 2) {
      return { forLabel:"ゲーム", againstLabel:"-", gameOver:true, winner:"for" };
    }
    if (pointsAgainst >= 4 && pointsAgainst - pointsFor >= 2) {
      return { forLabel:"-", againstLabel:"ゲーム", gameOver:true, winner:"against" };
    }
    if (pointsFor >= 3 && pointsAgainst >= 3) {
      if (pointsFor === pointsAgainst) {
        return { forLabel:"40", againstLabel:"40", deuce:true };
      }
      const forAhead = pointsFor > pointsAgainst;
      return {
        forLabel: forAhead ? "AD" : "40",
        againstLabel: forAhead ? "40" : "AD",
        advantage: forAhead ? "for" : "against",
      };
    }
    const L = ["0","15","30","40"];
    return { forLabel:L[pointsFor], againstLabel:L[pointsAgainst] };
  }

  /** ラリーアタックの1打あたりの得点。コンボが伸びるほど倍率が上がる */
  function rallyPoints(tier, combo){
    const TIER_PTS = { perfect:3, good:1.5, ok:1 };
    return Math.round(50 * (TIER_PTS[tier] || 1) * (1 + 0.04 * Math.min(combo, 50)));
  }

  /* =========================================================
     3b. Scores / Leaderboard / RankUI — ローカルのベスト記録と、みんなのTOP10。
         Rhythm_game から移植(Firestore の REST API を fetch だけで叩く)。
         書き込みは Firestore 側のセキュリティルールで検証・制限しており、
         既存の記録の書き換え・削除はルール上できない。
     ========================================================= */
  const Scores = (function(){
    function keyOf(gameId){ return "tennis-game:best-" + gameId; }
    function get(gameId){
      try { return JSON.parse(localStorage.getItem(keyOf(gameId)) || "null"); } catch (e) { return null; }
    }
    function submit(gameId, score, extra){
      const prev = get(gameId);
      const isNew = !prev || score > prev.score;
      const rec = {
        score: isNew ? score : prev.score,
        extra: isNew ? (extra || null) : prev.extra,
        playCount: (prev && prev.playCount ? prev.playCount : 0) + 1,
      };
      try { localStorage.setItem(keyOf(gameId), JSON.stringify(rec)); } catch (e) {}
      return { rec: rec, isNew: isNew };
    }
    function reset(gameId){ try { localStorage.removeItem(keyOf(gameId)); } catch (e) {} }
    return { get, submit, reset };
  })();

  const Leaderboard = (function(){
    const PROJECT_ID = "rythm-game-mo";
    const API_KEY = "AIzaSyBBo4f_LqJ2lfdKu8Q11oeiiYq_O-15LSc";
    const ROOT = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";

    function toValue(v){
      if (v === null || v === undefined) return { nullValue: null };
      if (typeof v === "string") return { stringValue: v };
      if (typeof v === "number") return { integerValue: String(Math.round(v)) };
      if (typeof v === "boolean") return { booleanValue: v };
      if (typeof v === "object") {
        const fields = {};
        Object.keys(v).forEach(function(k){ fields[k] = toValue(v[k]); });
        return { mapValue: { fields: fields } };
      }
      return { nullValue: null };
    }
    function fromValue(fv){
      if (!fv) return null;
      if ("stringValue" in fv) return fv.stringValue;
      if ("integerValue" in fv) return parseInt(fv.integerValue, 10);
      if ("doubleValue" in fv) return fv.doubleValue;
      if ("booleanValue" in fv) return fv.booleanValue;
      if ("timestampValue" in fv) return fv.timestampValue;
      if ("mapValue" in fv) return fieldsToObj(fv.mapValue && fv.mapValue.fields);
      return null;
    }
    function fieldsToObj(fields){
      const out = {};
      Object.keys(fields || {}).forEach(function(k){ out[k] = fromValue(fields[k]); });
      return out;
    }
    function fetchTop10(gameId){
      const url = ROOT + "/leaderboard/" + encodeURIComponent(gameId) + ":runQuery?key=" + API_KEY;
      const body = { structuredQuery: { from: [{ collectionId: "scores" }],
        orderBy: [{ field: { fieldPath: "score" }, direction: "DESCENDING" }], limit: 10 } };
      return fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
        .then(function(res){ if (!res.ok) throw new Error("http " + res.status); return res.json(); })
        .then(function(rows){
          return (rows || []).filter(function(r){ return r && r.document; }).map(function(r){
            const obj = fieldsToObj(r.document.fields);
            obj.id = r.document.name.split("/").pop();
            return obj;
          });
        })
        .catch(function(e){ console.warn("leaderboard fetch failed:", e); return null; });
    }
    function submitScore(gameId, initials, score, extra){
      const url = ROOT + "/leaderboard/" + encodeURIComponent(gameId) + "/scores?key=" + API_KEY;
      const fields = {
        initials: toValue(String(initials || "???").slice(0, 6)),
        score: toValue(score),
        ts: { timestampValue: new Date().toISOString() },
      };
      if (extra != null) fields.extra = toValue(extra);
      return fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fields: fields }) })
        .then(function(res){ if (!res.ok) throw new Error("http " + res.status); return res.json(); });
    }
    return { fetchTop10, submitScore };
  })();

  const RankUI = (function(){
    function renderList(list){
      const ol = $("rankList");
      ol.innerHTML = "";
      if (!list.length) {
        ol.innerHTML = '<li class="rankEmpty">まだ記録がありません。最初の1人になろう！</li>';
        return;
      }
      list.forEach(function(row, i){
        const li = document.createElement("li");
        const no = document.createElement("span");
        no.className = "rankNo"; no.textContent = (i + 1) + ".";
        const init = document.createElement("span");
        init.className = "rankInit"; init.textContent = row.initials || "???";
        const sc = document.createElement("span");
        sc.className = "rankScore"; sc.textContent = row.score;
        li.appendChild(no); li.appendChild(init); li.appendChild(sc);
        ol.appendChild(li);
      });
    }
    // ソフトキーボードで入力欄が隠れないようにし、Enterでそのまま登録できるようにする
    $("rankInitials").addEventListener("focus", function(){
      setTimeout(function(){ $("rankInitials").scrollIntoView({ block:"center", behavior:"smooth" }); }, 300);
    });
    $("rankInitials").addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); $("rankSubmitBtn").click(); }
    });

    function show(gameId, score, extra){
      $("rankList").innerHTML = '<li class="rankEmpty">読み込み中…</li>';
      $("rankEntry").classList.remove("show");
      $("rankStatus").textContent = "";
      Leaderboard.fetchTop10(gameId).then(function(top10){
        if (top10 === null) {
          $("rankList").innerHTML = "";
          $("rankStatus").textContent = "ランキングを取得できませんでした（通信環境をご確認ください）";
          return;
        }
        renderList(top10);
        const qualifies = score > 0 && (top10.length < 10 || score > top10[top10.length - 1].score);
        if (!qualifies) return;
        $("rankEntry").classList.add("show");
        $("rankInitials").value = "";
        const btn = $("rankSubmitBtn");
        btn.disabled = false;
        btn.textContent = "登録する";
        btn.onclick = function(){
          const initials = ($("rankInitials").value || "").trim() || "???";
          btn.disabled = true;
          btn.textContent = "登録中…";
          Leaderboard.submitScore(gameId, initials, score, extra).then(function(){
            $("rankStatus").textContent = "登録しました！";
            $("rankEntry").classList.remove("show");
            return Leaderboard.fetchTop10(gameId);
          }).then(function(fresh){
            if (fresh) renderList(fresh);
          }).catch(function(){
            $("rankStatus").textContent = "登録に失敗しました。もう一度お試しください。";
            btn.disabled = false;
            btn.textContent = "登録する";
          });
        };
      });
    }
    return { show, renderList };
  })();

  /* =========================================================
     3c. Progress — 実績とアンロック(コート/ラケットの色)。
         実績はイベント駆動で、Progress.on(event, ctx) が条件を満たしたものを解除する。
     ========================================================= */
  const Progress = (function(){
    const KEY = "tennis-game:progress";
    const ACHIEVEMENTS = [
      { id:"first_win",   name:"はじめての勝利",   desc:"トーナメントで1勝する" },
      { id:"love_game",   name:"ラブゲーム",       desc:"4-0で勝つ" },
      { id:"deuce_win",   name:"デュースを制す",   desc:"デュースになった試合に勝つ" },
      { id:"no_miss_game",name:"ノーミス",         desc:"1度もミスせずに勝つ" },
      { id:"perfect_10",  name:"パーフェクト×10", desc:"1試合でPERFECTを10回出す" },
      { id:"smash_point", name:"必殺スマッシュ",   desc:"スマッシュで得点する" },
      { id:"lob_point",   name:"頭上を越えて",     desc:"ロブで得点する" },
      { id:"beat_rusher", name:"ネット封じ",       desc:"ネットラッシャーに勝つ" },
      { id:"champion",    name:"チャンピオン",     desc:"トーナメントで優勝する" },
      { id:"rally_30",    name:"ラリー30",         desc:"ラリーアタックで30回続ける" },
      { id:"rally_100",   name:"ラリー100",        desc:"ラリーアタックで100回続ける" },
      { id:"combo_20",    name:"コンボ20",         desc:"ラリーアタックで20コンボ" },
    ];
    // 解除でアンロックされるもの(装備はタイトル画面で選ぶ)
    const COURTS = [
      { id:"green", name:"グラス", need:null },
      { id:"hard",  name:"ハード", need:"first_win" },
      { id:"clay",  name:"クレー", need:"rally_30" },
      { id:"night", name:"ナイター", need:"champion" },
    ];
    const BALLS = [
      { id:"classic", name:"イエロー", need:null },
      { id:"gold",    name:"ゴールド", need:"perfect_10" },
      { id:"neon",    name:"ネオン",   need:"combo_20" },
    ];

    function load(){
      let r = null;
      try { r = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
      if (!r || r.v !== 1) r = { v:1, ach:{}, equipped:{ court:"green", ball:"classic" }, stats:{} };
      if (!r.ach) r.ach = {};
      if (!r.equipped) r.equipped = { court:"green", ball:"classic" };
      return r;
    }
    function save(r){ try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
    function reset(){ try { localStorage.removeItem(KEY); } catch (e) {} }
    function has(id){ return !!load().ach[id]; }
    function unlocked(item){ return !item.need || has(item.need); }

    let queue = [];
    function grant(id){
      const r = load();
      if (r.ach[id]) return false;
      r.ach[id] = new Date().toISOString();
      save(r);
      queue.push(ACHIEVEMENTS.find(function(a){ return a.id === id; }));
      flushToasts();
      return true;
    }
    // 解除トーストを順番に出す(同時解除はキューで順送り)
    let toasting = false;
    function flushToasts(){
      if (toasting || !queue.length) return;
      toasting = true;
      const a = queue.shift();
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = '<b>実績解除</b><span>' + a.name + '</span>';
      $("toasts").appendChild(el);
      Sfx.unlockJingle();
      setTimeout(function(){
        el.classList.add("out");
        setTimeout(function(){
          if (el.parentNode) el.parentNode.removeChild(el);
          toasting = false;
          flushToasts();
        }, 350);
      }, 2400);
    }

    /** 試合/ランの結果から実績を判定する。res は TennisGame の finish() が渡すもの */
    function onResult(res){
      if (res.mode === "rally") {
        if (res.hits >= 30) grant("rally_30");
        if (res.hits >= 100) grant("rally_100");
        if (res.maxCombo >= 20) grant("combo_20");
      } else if (res.win) {
        grant("first_win");
        if (res.pointsOpponent === 0) grant("love_game");
        if (res.deuceSeen) grant("deuce_win");
        if (res.playerMisses === 0) grant("no_miss_game");
        if (res.opponentId === "rusher") grant("beat_rusher");
        if (res.opponentId === "champion") grant("champion");
      }
      if (res.perfects >= 10) grant("perfect_10");
      if (res.smashPoints > 0) grant("smash_point");
      if (res.lobPoints > 0) grant("lob_point");
    }
    function equip(kind, id){
      const r = load();
      r.equipped[kind] = id;
      save(r);
      applyEquipped();
    }
    /** 装備中のコート/ボールの色をCSSに反映する(見た目だけ) */
    function applyEquipped(){
      const r = load();
      $("court").dataset.theme = r.equipped.court || "green";
      $("ball").dataset.skin = r.equipped.ball || "classic";
    }
    function countText(){
      const r = load();
      return Object.keys(r.ach).length + "/" + ACHIEVEMENTS.length;
    }
    return { ACHIEVEMENTS, COURTS, BALLS, load, reset, has, unlocked, grant, onResult,
      equip, applyEquipped, countText };
  })();

  /* =========================================================
     4. Characters — 10人のマスコットと、その見た目
        ふにふに/ことこと は idle/run/swing の3ポーズ画像(fal.ai生成の透過PNG)を持つ。
        あとの8人はまだ画像が無いので、体色・差し色・耳の形だけを持たせて
        SVG(MochiArt)でその場で描く。画像が用意できたら CHARACTERS に
        idle/run/swing のパスを足すだけで自動的にそちらが使われる。
        素材は左向きに描かれているので、右を向く時は .body の --flip で反転する。
     ========================================================= */
  const CHARACTERS = [
    { id:"funifuni", name:"ふにふに", body:"#fdfaf3", accent:"#8ec5e8", ear:"none", file:"art/funifuni.png",
      idle:"art/funifuni-idle.png", run:"art/funifuni-run.png", swing:"art/funifuni-swing.png" },
    { id:"kotokoto", name:"ことこと", body:"#fdf6ea", accent:"#b9a7e0", ear:"cat", file:"art/kotokoto.png",
      idle:"art/kotokoto-idle.png", run:"art/kotokoto-run.png", swing:"art/kotokoto-swing.png" },
    { id:"mokomoko", name:"もこもこ", body:"#fbf3e2", accent:"#8fd9c0", ear:"sheep" },
    { id:"petapeta",  name:"ぺたぺた", body:"#dfe7f2", accent:"#f79c8b", ear:"penguin" },
    { id:"piyopiyo",  name:"ぴよぴよ", body:"#fde9a9", accent:"#f7a8c4", ear:"chick" },
    { id:"pyonpyon",  name:"ぴょんぴょん", body:"#fdf7f7", accent:"#f6b89b", ear:"rabbit" },
    { id:"nosonoso",  name:"のそのそ", body:"#e8cfae", accent:"#f2c14e", ear:"bear" },
    { id:"kerokero",  name:"けろけろ", body:"#c8e6a8", accent:"#f5a05a", ear:"frog" },
    { id:"patapata",  name:"ぱたぱた", body:"#ddd8ea", accent:"#6ec7c7", ear:"owl" },
    { id:"chikuchiku",name:"ちくちく", body:"#f0dfc4", accent:"#ef8f7e", ear:"hedgehog" }
  ];
  const missingArt = {};   // 読めなかった画像パス → true(フォールバックに切り替える)
  CHARACTERS.forEach(function(c){
    ["idle","run","swing"].forEach(function(pose){
      if (!c[pose]) return;
      const probe = new Image();
      probe.onerror = function(){ missingArt[c[pose]] = true; };
      probe.src = c[pose];
    });
  });
  /** キャラID + ポーズ → 画像パス。ポーズ画像が無い/読めない時は null(SVGで描く) */
  function poseFile(charId, pose){
    const c = findChar(charId);
    const f = c[pose] || c.idle;
    if (!f) return null;
    if (!missingArt[f]) return f;
    return (c.file && !missingArt[c.file]) ? c.file : null;
  }

  /* MochiArt — 画像を持たないキャラを、体色・差し色・耳の形からSVGで描く。
     もちっとした輪郭・丸い目・ほお紅は共通で、耳と色だけで描き分ける。 */
  const MochiArt = (function(){
    // 耳(頭の左右)。体の上に重ねる
    const EARS = {
      none:  "",

      sheep: '<circle cx="32" cy="30" r="11" fill="{body}" stroke="{line}" stroke-width="3"/>' +

             '<circle cx="72" cy="20" r="12" fill="{body}" stroke="{line}" stroke-width="3"/>' +

      chick: '<path d="M60 16 L54 30 L66 30 Z" fill="{accent}" stroke="{line}" stroke-width="2.5" stroke-linejoin="round"/>',
      penguin:'<path d="M40 30 Q60 16 80 30" fill="none" stroke="{line}" stroke-width="3" stroke-linecap="round"/>',
      frog:  '<circle cx="38" cy="26" r="14" fill="{body}" stroke="{line}" stroke-width="3"/>' +

      hedgehog:'<path d="M26 44 L18 24 L38 34 L36 14 L54 30 L60 10 L66 30 L84 14 L82 34 L102 24 L94 44 Z" ' +
