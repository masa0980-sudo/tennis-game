<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コート・ラリー</title>
<style>
  :root{
    color-scheme: dark;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --danger:#f87171;
    --good:#34d399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0b1020; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
  /* タイトル・結果画面の背景。fal.ai生成(art/title-bg.png)で、中央は暗く
     余白にしてあり、四隅にラケット・ボールの光跡がうっすら入っている構図。
     コートを敷いたプレイ中(#play)は視認性を優先して薄暗くするだけに留める。 */
  #app{ background:#0b1020 url("art/title-bg.png") center / cover no-repeat; }
  /* プレイ中は背景画像を薄暗くする半透明の幕を重ねる(コート・文字の視認性優先) */
  #play{ background:rgba(11,16,32,.55); }
  #app{ position:relative; min-height:100dvh; width:100%; overflow:hidden; touch-action:none; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center; }
  .screen.active{ display:flex; }

  h1{ font-size:28px; margin:0; letter-spacing:.02em; }
  .sub{ color:#9aa4c4; font-size:13px; margin:0; }

  /* タイトル画面の操作説明パネル。文章の羅列にせず、行ごとに絵文字アイコンを
     置いて視認性を上げる(初見のプレイヤーがルールをすぐ把握できるように)。 */
  .howTo{ display:flex; flex-direction:column; gap:6px; padding:12px 16px; border-radius:14px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    max-width:360px; width:100%; }
  .howRow{ display:flex; align-items:center; gap:9px; font-size:12px; color:#cbd5e1; text-align:left; }
  .howIcon{ font-size:15px; flex-shrink:0; width:20px; text-align:center; }

  .charRow{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .charBtn{ background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14);
    border-radius:18px; padding:12px 10px; display:flex; flex-direction:column; align-items:center;
    gap:4px; cursor:pointer; color:#fff; width:112px; }
  /* 高さを体格が一番大きいキャラ(scale最大)に合わせて固定し、キャラ画像の
     大小に関わらず名前・ステータス行の位置を揃える(=体格差だけが目に入る) */
  .charImgBox{ height:88px; display:flex; align-items:flex-end; justify-content:center; }
  .charBtn img{ height:auto; image-rendering:-webkit-optimize-contrast; }
  .charBtn.selected{ border-color:var(--accent); box-shadow:0 0 22px rgba(56,189,248,.45);
    background:rgba(56,189,248,.12); }
  .charBtn .cname{ font-size:13px; font-weight:700; }
  .charBtn .crole{ font-size:10px; color:var(--accent2); font-weight:700; margin-bottom:2px; }

  .statBox{ width:100%; display:flex; flex-direction:column; gap:3px; }
  .statRow{ display:flex; align-items:center; gap:4px; }
  .statLabel{ font-size:8px; color:#9aa4c4; width:34px; text-align:right; flex-shrink:0; white-space:nowrap; }
  .statBar{ flex:1; height:5px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .statFill{ display:block; height:100%; border-radius:999px; }
  .stat-speed{ background:#7dd3fc; }
  .stat-power{ background:#fb923c; }
  .stat-stamina{ background:#34d399; }

  .bigBtn{ padding:16px 40px; border-radius:16px; border:none; font-size:18px; font-weight:800;
    color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 24px rgba(56,189,248,.4); cursor:pointer; }
  .bigBtn:active{ transform:scale(.96); }
  .ghostBtn{ padding:10px 22px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05); color:#fff; font-size:14px; cursor:pointer; }

  /* ===== プレイ画面 ===== */
  #play{ justify-content:space-between; padding:16px 12px 24px; }
  .hud{ display:flex; justify-content:space-between; width:100%; max-width:460px;
    font-variant-numeric:tabular-nums; font-size:12px; color:#9aa4c4; }
  .hud b{ color:#fff; font-size:26px; display:block; }
  .hud .you b{ color:#7dd3fc; }
  .hud .cpu b{ color:#f0abfc; }
  .deuceNote{ align-self:center; font-size:11px; font-weight:800; letter-spacing:.08em;
    color:#fde68a; padding:3px 10px; border-radius:999px; background:rgba(253,230,138,.14);
    border:1px solid rgba(253,230,138,.4); }
  .deuceNote[hidden]{ display:none; }
  .oppName{ display:block; font-size:10px; font-weight:400; color:#9aa4c4; }

  /* スタミナバー: 動くほど減り、止まると回復する。空になると操作が重くなる
     (=キャラのstamina statによる「操作性の違い」を見た目でも実感できるように)。 */
  .staminaWrap{ display:flex; align-items:center; gap:8px; width:100%; max-width:460px; }
  .staminaLabel{ font-size:10px; color:#9aa4c4; white-space:nowrap; flex-shrink:0; }
  .staminaBar{ flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .staminaFill{ display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,#34d399,#7dd3fc); transition:width .1s linear, background .2s; }
  .staminaFill.low{ background:linear-gradient(90deg,#f87171,#fb923c);
    animation:staminaPulse .5s ease-in-out infinite alternate; }
  @keyframes staminaPulse{ from{ opacity:1; } to{ opacity:.5; } }

  /* テニスコート風の背景。芝(グリーン)の地に、シングルスのサイドライン・
     サービスラインを白線で描く。実寸どおりの比率ではなく、あくまで
     「テニスコートらしく見える」ことを優先した簡略デザイン */
  /* 縦長のテニスコートに固定する。高さ(flex:1で残り空間いっぱい)から
     幅をaspect-ratioで導出する側に倒す(幅を先に決めて高さを残り空間任せに
     すると、横長で低い画面のときにコートまで横長になってしまっていたため)。 */
  .court{ position:relative; flex:1; width:auto; max-width:460px; aspect-ratio:2/3; margin:8px auto;
    background:
      linear-gradient(transparent 0 30%, rgba(255,255,255,.4) 30% calc(30% + 2px), transparent calc(30% + 2px) 100%),
      linear-gradient(transparent 0 70%, rgba(255,255,255,.4) 70% calc(70% + 2px), transparent calc(70% + 2px) 100%),
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.4) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 30% / 100% 40% no-repeat,
      linear-gradient(90deg,
        transparent 0 10%, rgba(255,255,255,.55) 10% calc(10% + 2px), transparent calc(10% + 2px) 90%,
        rgba(255,255,255,.55) 90% calc(90% + 2px), transparent calc(90% + 2px) 100%),
      linear-gradient(180deg, #1f6b4f, #1c6349 40%, #14432f);
    border:3px solid rgba(255,255,255,.6); border-radius:14px; overflow:hidden; }
  .netLine{ position:absolute; left:6%; right:6%; top:48%; height:6px; margin-top:-3px;
    background:
      repeating-linear-gradient(90deg, rgba(10,20,15,.9) 0 6px, transparent 6px 7px),
      linear-gradient(#fff, #fff) top / 100% 2px no-repeat,
      #0d1f17;
    box-shadow:0 2px 4px rgba(0,0,0,.4); z-index:2; }

  .ballShadow{ position:absolute; width:22px; height:8px; margin-left:-11px; margin-top:-4px;
    border-radius:50%; background:rgba(0,0,0,.35); filter:blur(1px); z-index:3; }
  .ball{ position:absolute; width:22px; height:22px; margin-left:-11px; margin-top:-11px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #ffd54a 55%, #f3a712 100%);
    box-shadow:0 0 10px rgba(255,213,74,.7); z-index:4; transition: box-shadow .08s; }
  .ball.hidden{ opacity:0; }
  /* ボールが「今の打点(位置+タイミング)なら実際にヒットする」瞬間だけ強く光る。
     判定ルールと完全に同じ式で光らせるので、見た目と成否が食い違わない */
  .ball.ready{ box-shadow:0 0 4px 2px #fff, 0 0 22px 9px rgba(255,213,74,.95); }

  /* 自分の「打てる範囲」を示すバー。プレイヤーの現在位置に追従する。
     ボールが自分に向かっているあいだは薄く見えているだけ(=位置の目安)で、
     実際にタップすればヒットする瞬間だけ明るく光って脈打つ(=判定と直結)。
     以前の点線の輪は「ラリー中ずっと同じ見た目」で分かりにくかったための作り直し。 */
  .hitZone{ position:absolute; bottom:12%; width:34%; max-width:170px; height:14px;
    margin-left:-17%; border-radius:999px; z-index:1; pointer-events:none;
    background:rgba(255,255,255,.12); opacity:0; transition:left .05s linear, opacity .15s, background .1s, box-shadow .1s; }
  .hitZone.visible{ opacity:1; }
  .hitZone.ready{ background:linear-gradient(90deg, rgba(56,189,248,.5), #7dd3fc, rgba(56,189,248,.5));
    box-shadow:0 0 18px rgba(56,189,248,.85); animation:hitZonePulse .3s ease-in-out infinite alternate; }
  @keyframes hitZonePulse{ from{ transform:scaleY(1); } to{ transform:scaleY(1.5); } }

  /* キャラの向き(--flip: 1=通常/-1=左右反転)は素材が左向きに描かれているため、
     右へ移動するときだけ反転する。ヒット/ミス演出のtransformはこの反転と
     衝突しないよう、必ずscaleX(var(--flip,1))を先頭に合成する。 */
  .charWrap{ position:absolute; z-index:5; transition:left .05s linear; }
  .charWrap img{ width:88px; height:auto; transition: transform .12s;
    transform: scaleX(var(--flip,1)); }
  .charWrap.hit img{ transform: scaleX(var(--flip,1)) scale(1.16) rotate(-6deg); }
  .charWrap.miss img{ transform: scaleX(var(--flip,1)) scale(.92) rotate(8deg); filter:grayscale(.5); }
  .charWrap.whiff img{ transform: scaleX(var(--flip,1)) rotate(-14deg); }

  .playerWrap{ bottom:0.5%; transform:translateX(-50%); }
  .playerWrap img{ width:92px; }
  .playerWrap.hit img{ transform: scaleX(var(--flip,1)) scale(1.18) rotate(-6deg); }

  .opponentWrap{ top:0.5%; transform:translateX(-50%); }
  .opponentWrap img{ width:78px; }
  .opponentWrap.hit img{ transform: scaleX(var(--flip,1)) scale(1.18) rotate(6deg); }

  .tapHint{ font-size:12px; color:#9aa4c4; }

  .flash{ position:absolute; inset:0; pointer-events:none; opacity:0; z-index:6; }
  .flash.good{ background:rgba(52,211,153,.18); }
  .flash.bad{ background:rgba(248,113,113,.22); }
  .flash.show{ animation: flashOut .3s ease-out; }
  @keyframes flashOut{ from{ opacity:1; } to{ opacity:0; } }

  .moveButtons{ display:flex; gap:10px; margin-top:4px; }
  .moveBtn{ width:56px; height:44px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06); color:#fff; font-size:20px; touch-action:manipulation; }
  .moveBtn:active{ background:rgba(56,189,248,.25); }

  #result .rank{ font-size:40px; font-weight:900; margin:0; }
  #result .score{ font-size:15px; color:#9aa4c4; }
  #result .score b{ color:#fff; font-size:28px; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= タイトル(キャラクター選択) ================= -->
  <section id="title" class="screen active">
    <h1>コート・ラリー</h1>
    <p class="sub">左右に動いてボールに合わせ、タイミングよく打ち返そう。</p>
    <div class="howTo">
      <div class="howRow"><span class="howIcon">🕹️</span><span>← → / A D / 画面のボタンで左右移動</span></div>
      <div class="howRow"><span class="howIcon">👆</span><span>タップ・クリック・スペースキーで打つ</span></div>
      <div class="howRow"><span class="howIcon">💡</span><span>足元のバーとボールが光ったら打ち頃のサイン</span></div>
      <div class="howRow"><span class="howIcon">🎯</span><span>打つ瞬間に押した左右キーで狙う方向を変えられる</span></div>
      <div class="howRow"><span class="howIcon">⚡</span><span>動き続けるとスタミナが減り、足が遅くなる</span></div>
    </div>
    <div class="charRow" id="charRow"></div>
    <button class="bigBtn" id="startBtn">はじめる</button>
  </section>

  <!-- ================= プレイ ================= -->
  <section id="play" class="screen">
    <div class="hud">
      <span class="you">あなた<b id="playerScore">0</b></span>
      <span class="deuceNote" id="deuceNote" hidden>デュース</span>
      <span class="cpu">相手<span class="oppName" id="opponentName"></span><b id="opponentScore">0</b></span>
    </div>
    <div class="staminaWrap">
      <span class="staminaLabel">スタミナ</span>
      <span class="staminaBar"><span class="staminaFill" id="staminaFill"></span></span>
    </div>
    <div class="court" id="court">
      <div class="netLine"></div>
      <div class="opponentWrap charWrap" id="opponentWrap">
        <img id="opponentImg" alt="">
      </div>
      <div class="ballShadow" id="ballShadow"></div>
      <div class="ball" id="ball"></div>
      <div class="hitZone" id="hitZone"></div>
      <div class="playerWrap charWrap" id="playerWrap">
        <img id="playerImg" alt="">
      </div>
      <div class="flash" id="flash"></div>
    </div>
    <p class="tapHint">← → / A D で移動・タップで打つ（打つ瞬間に押した方向へ狙いを変えられる）</p>
    <div class="moveButtons" id="moveButtons">
      <button class="moveBtn" id="btnLeft">◀</button>
      <button class="moveBtn" id="btnRight">▶</button>
    </div>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="screen">
    <span class="sub">RESULT</span>
    <p class="rank" id="rankVal">-</p>
    <p class="score">あなた <b id="resultPlayer">0</b> ー <b id="resultOpponent">0</b> 相手</p>
    <button class="bigBtn" id="retryBtn">もう一度</button>
    <button class="ghostBtn" id="titleBtn">キャラを選び直す</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     0. 小道具
     ========================================================= */
  function $(id){ return document.getElementById(id); }
  const SCREENS = ["title","play","result"];
  function show(id){
    SCREENS.forEach(function(s){
      $(s).classList.toggle("active", s === id);
    });
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t){ return a + (b - a) * t; }

  /* =========================================================
     1. キャラクター
     ========================================================= */
  // 各キャラクター4ポーズ(idle/run/swing)のスポーティ画像。fal.aiで生成した
  // ものを元のLINEスタンプ(stamp_01_funifuni2026.png / stamp_02_kotokoto2026.png)
  // のシルエット・表情を踏襲しつつ差し替えた。run-left/run-rightは1枚の
  // run画像をCSSで左右反転(--flip)して兼用する(素材は左向きに描かれている)。
  //
  // stats(speed/power/stamina)は1〜10のゲームバランス値で、選択画面のバー表示と
  // 実際のプレイ内容(移動速度・打球の速さ・スタミナ切れ)の両方に使う。
  // scaleは表示上の体格差(小さい〜大きい)。基準(scale=1)はkotokotoの各stat=6。
  const STAT_BASELINE = 6;
  const CHARACTERS = [
    { id:"funifuni", name:"ふにふに", role:"スピード型", scale:0.82,
      stats:{ speed:9, power:4, stamina:6 },
      idle:"art/funifuni-idle.png", run:"art/funifuni-run.png", swing:"art/funifuni-swing.png" },
    { id:"kotokoto", name:"ことこと", role:"バランス型", scale:1,
      stats:{ speed:6, power:6, stamina:7 },
      idle:"art/kotokoto-idle.png", run:"art/kotokoto-run.png", swing:"art/kotokoto-swing.png" },
    { id:"muchimuchi", name:"むちむち", role:"パワー型", scale:1.32,
      stats:{ speed:4, power:9, stamina:5 },
      idle:"art/muchimuchi-idle.png", run:"art/muchimuchi-run.png", swing:"art/muchimuchi-swing.png" }
  ];
  const CHAR_KEY = "tennis-game:character";
  let selectedChar = localStorage.getItem(CHAR_KEY) || CHARACTERS[0].id;
  if (!CHARACTERS.some(function(c){ return c.id === selectedChar; })) selectedChar = CHARACTERS[0].id;

  const STAT_LABELS = { speed:"スピード", power:"パワー", stamina:"スタミナ" };
  function statBarsHtml(stats){
    return Object.keys(STAT_LABELS).map(function(key){
      const pct = clamp(stats[key] * 10, 0, 100);
      return '<div class="statRow">' +
        '<span class="statLabel">' + STAT_LABELS[key] + '</span>' +
        '<span class="statBar"><span class="statFill stat-' + key + '" style="width:' + pct + '%"></span></span>' +
        '</div>';
    }).join("");
  }

  function paintCharRow(){
    const box = $("charRow");
    box.innerHTML = "";
    CHARACTERS.forEach(function(c){
      const btn = document.createElement("button");
      btn.className = "charBtn" + (c.id === selectedChar ? " selected" : "");
      // scaleが体格差(小さい〜大きい)。プレビュー画像にもそのまま反映して
      // 選択画面の時点で見た目のバラエティが伝わるようにする。
      btn.innerHTML =
        '<div class="charImgBox"><img src="' + c.idle + '" alt="' + c.name +
          '" style="width:' + Math.round(64 * c.scale) + 'px"></div>' +
        '<span class="cname">' + c.name + '</span>' +
        '<span class="crole">' + c.role + '</span>' +
        '<div class="statBox">' + statBarsHtml(c.stats) + '</div>';
      btn.addEventListener("click", function(){
        selectedChar = c.id;
        localStorage.setItem(CHAR_KEY, selectedChar);
        paintCharRow();
      });
      box.appendChild(btn);
    });
  }

  function findChar(id){
    return CHARACTERS.find(function(x){ return x.id === id; }) || CHARACTERS[0];
  }
  /** 対戦相手を選ぶ(3体以上いる場合は自分以外からランダムに1体)。
      rand引数を通すことでPlaywrightから固定できるようにする(setRngと同じ考え方)。 */
  function pickOpponent(id, rand){
    const others = CHARACTERS.filter(function(x){ return x.id !== id; });
    if (others.length === 0) return CHARACTERS[0];
    const i = Math.min(others.length - 1, Math.floor(rand() * others.length));
    return others[i];
  }
  /** stat(1〜10)をSTAT_BASELINE基準の倍率にする。移動速度・打球の速さなど
      「基準キャラを1倍として、そのキャラは何倍か」を統一的に扱うための関数。 */
  function statMultiplier(statValue){
    return statValue / STAT_BASELINE;
  }
  /** キャラID + ポーズ名("idle"|"run"|"swing") から画像パスを引く */
  function poseFile(charId, pose){
    return findChar(charId)[pose] || findChar(charId).idle;
  }

  /* =========================================================
     2. Court — 座標系だけを持つ小さなモジュール(DOM非依存)
     論理X座標は0〜100。CSS上はシングルスのサイドライン(背景に描いた10%〜90%)
     いっぱいまで使う(以前は15%〜85%に絞っていて、コートの余白が広く
     見えすぎていた)。前後移動は無く(=奥行きは今回のスコープ外)、
     左右移動だけを扱う。
     ========================================================= */
  const Court = {
    X_MIN: 0, X_MAX: 100,
    CSS_MIN: 10, CSS_MAX: 90,
    PLAYER_Y: 93,     // 自分の打点(コート下端ぎりぎり、%)
    OPPONENT_Y: 4,    // 相手の打点(コート上端ぎりぎり、%)
    toCssX: function(x){ return Court.CSS_MIN + (Court.CSS_MAX - Court.CSS_MIN) * (x / 100); },
  };

  /* =========================================================
     3. Rng — 差し替え可能な乱数(Playwrightから相手の挙動を固定できるようにする)
     ========================================================= */
  let rand = Math.random;
  function setRng(fn){ rand = (typeof fn === "function") ? fn : Math.random; }

  /* =========================================================
     4. スコア — 本物のテニス採点(0/15/30/40、デュース/アドバンテージ)。
     DOMに触れない純粋関数にし、生の得点(pointsFor/pointsAgainst)から
     毎回ラベルを導出する(セット・マッチはスコープ外、1ゲームの勝敗のみ)。
     ========================================================= */
  function scoreLabels(pointsFor, pointsAgainst){
    if (pointsFor >= 4 && pointsFor - pointsAgainst >= 2) {
      return { forLabel:"ゲーム", againstLabel:"-", gameOver:true, winner:"for" };
    }
    if (pointsAgainst >= 4 && pointsAgainst - pointsFor >= 2) {
      return { forLabel:"-", againstLabel:"ゲーム", gameOver:true, winner:"against" };
    }
    if (pointsFor >= 3 && pointsAgainst >= 3) {
      if (pointsFor === pointsAgainst) {
        return { forLabel:"40", againstLabel:"40", deuce:true };
      }
      const forAhead = pointsFor > pointsAgainst;
      return {
        forLabel: forAhead ? "AD" : "40",
        againstLabel: forAhead ? "40" : "AD",
        advantage: forAhead ? "for" : "against",
      };
    }
    const L = ["0","15","30","40"];
    return { forLabel:L[pointsFor], againstLabel:L[pointsAgainst] };
  }

  /* =========================================================
     5. Audio — BGM・効果音をWeb Audio APIで自前合成する(外部音源ファイル不要)。
     AudioContextはユーザー操作の中でしか生成・再開できないため、実際の生成は
     startBgm()の初回呼び出し(=はじめる/もう一度ボタンのクリックの中)まで遅らせる。
     ========================================================= */
  const AudioFX = (function(){
    let ctx = null, master = null;
    let bgmOn = false, bgmStep = 0, nextNoteTime = 0, schedTimer = null;
    const BGM_BPM = 128;
    const STEP_SEC = 60 / BGM_BPM / 2;   // 8分音符刻み
    const LOOKAHEAD_SEC = 0.15;          // この秒数だけ先まで予約しておく
    const SCHED_INTERVAL_MS = 40;

    function ensureCtx(){
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      // 96kHzで動くと処理量が倍近くになる実例があったため48kHzに明示的に制限する
      ctx = new AC({ latencyHint: 0.05, sampleRate: 48000 });
      master = ctx.createGain();
      master.gain.value = 0.32;
      master.connect(ctx.destination);
      return ctx;
    }
    /** ユーザー操作のハンドラ内から必ず呼ぶこと(自動再生ポリシー対策)。
        Android Chrome等はAudioContextがsuspendedのまま生成されることがある。 */
    function resume(){
      const c = ensureCtx();
      if (c && c.state === "suspended") c.resume();
      return c;
    }

    /** 短いプラック音(ポン、と鳴る)。メロディにも効果音にも使う共通の音源。 */
    function pluck(freq, dur, gainAmt, when, type){
      const c = ensureCtx();
      if (!c) return;
      const t = when != null ? when : c.currentTime;
      const osc = c.createOscillator();
      osc.type = type || "triangle";
      osc.frequency.setValueAtTime(freq, t);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(gainAmt, 0.001), t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.02);
    }

    /** 短いノイズバースト(打球のインパクト音・ミスのブザーに使う)。
        毎回バッファを作り直さず、使い回すと軽い(neon-voidでの実績があるが、
        ここでは効果音の頻度が低いのでシンプルに毎回生成する)。 */
    function noiseBurst(dur, gainAmt, when, filterFreq, filterType){
      const c = ensureCtx();
      if (!c) return;
      const t = when != null ? when : c.currentTime;
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource();
      src.buffer = buf;
      const filt = c.createBiquadFilter();
      filt.type = filterType || "bandpass";
      filt.frequency.value = filterFreq || 1800;
      const g = c.createGain();
      g.gain.setValueAtTime(gainAmt, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt); filt.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.02);
    }

    // ---- BGM: ポップだが軽すぎない8ステップのループ(ベース+跳ねるメロディ) ----
    const BASS_NOTE = 98;                                  // G2相当。1・5拍目の土台
    const MELODY = [392, 0, 440, 523, 392, 0, 349, 440];   // ソ,休,ラ,ド,ソ,休,ファ,ラ
    function scheduleStep(step, t){
      if (step % 4 === 0) pluck(BASS_NOTE, STEP_SEC * 1.9, 0.24, t, "sine");
      const note = MELODY[step % MELODY.length];
      if (note) pluck(note, STEP_SEC * 0.9, 0.15, t, "triangle");
      if (step % 2 === 1) noiseBurst(0.03, 0.06, t, 6000, "highpass"); // 軽いハイハット
    }
    function scheduler(){
      if (!bgmOn) return;
      const c = ensureCtx();
      while (nextNoteTime < c.currentTime + LOOKAHEAD_SEC) {
        scheduleStep(bgmStep, nextNoteTime);
        nextNoteTime += STEP_SEC;
        bgmStep = (bgmStep + 1) % MELODY.length;
      }
      schedTimer = setTimeout(scheduler, SCHED_INTERVAL_MS);
    }
    function startBgm(){
      const c = resume();
      if (!c || bgmOn) return;
      bgmOn = true;
      bgmStep = 0;
      nextNoteTime = c.currentTime + 0.05;
      scheduler();
    }
    function stopBgm(){
      bgmOn = false;
      clearTimeout(schedTimer);
    }

    // ---- 効果音 ----
    function hitSfx(powerMul){
      const c = resume();
      if (!c) return;
      const freq = 480 + (powerMul || 1) * 90;
      pluck(freq, 0.12, 0.32, c.currentTime, "square");
      noiseBurst(0.05, 0.28, c.currentTime, 2600, "bandpass");
    }
    function whiffSfx(){
      const c = resume();
      if (!c) return;
      noiseBurst(0.16, 0.2, c.currentTime, 600, "lowpass");
    }
    function pointSfx(won){
      const c = resume();
      if (!c) return;
      const notes = won ? [523, 659, 784] : [392, 330];
      notes.forEach(function(f, i){ pluck(f, 0.18, 0.22, c.currentTime + i * 0.09, "triangle"); });
    }
    function gameEndSfx(won){
      const c = resume();
      if (!c) return;
      const notes = won ? [523, 659, 784, 1046] : [392, 349, 294, 247];
      notes.forEach(function(f, i){ pluck(f, 0.3, 0.24, c.currentTime + i * 0.15, "triangle"); });
    }

    return {
      startBgm: startBgm, stopBgm: stopBgm,
      hit: hitSfx, whiff: whiffSfx, point: pointSfx, gameEnd: gameEndSfx,
    };
  })();

  // タブが非表示になったらBGMを止める(バックグラウンド再生・電池消費対策)。
  // 復帰時、プレイ画面が表示されたままなら再開する。
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) { AudioFX.stopBgm(); return; }
    if ($("play").classList.contains("active")) AudioFX.startBgm();
  });
  window.addEventListener("pagehide", function(){ AudioFX.stopBgm(); });

  /* =========================================================
     6. ゲーム本体
     ========================================================= */
  const TennisGame = (function(){
    const REACH_RADIUS = 22;        // 届く範囲(論理単位。0〜100スケール)
    const PLAYER_SPEED = 0.085;     // 論理単位/ms
    const AI_SPEED = 0.072;         // 相手の上限速度(自分よりわずかに遅い=勝ち筋がある)
    const AI_REACTION_MS = 140;     // 相手が動き出すまでの反応遅延
    const START_DURATION = 1200;    // 最初の到達時間(ms)
    const MIN_DURATION = 680;
    const DURATION_STEP = 45;
    const WINDOW_MS = 260;          // 到達時刻より前、これだけ早くから成功にする
    const GRACE_MS = 150;           // 到達時刻より後、これだけ遅くても成功にする
    const ARC_HEIGHT = 42;          // ボールの山なり演出(px)
    const RETURN_PAUSE = 160;
    const SMART_RETURN_CHANCE = 0.35; // 相手がプレイヤーから遠い側を狙う確率(かしこい返球)
    const AIM_KEY_BIAS = 16;        // 打つ瞬間に左右キーを押していると、その方向へ狙いをずらす強さ
    const BOUNCE_MS = 180;          // hit/miss/whiffの見た目演出の長さ(swingポーズの表示時間も揃える)

    // ---- キャラのstats(speed/power/stamina)をゲームプレイに反映する ----
    const STAMINA_DRAIN_BASE = 0.026; // staminaステータス=基準のとき、動いている間に減る量/ms
    const STAMINA_REGEN_BASE = 0.05;  // staminaステータス=基準のとき、止まっている間に回復する量/ms
    const FATIGUE_EXIT_PCT = 30;      // このパーセントまで回復すると疲労状態から抜ける
    const FATIGUE_SPEED_MULT = 0.55;  // 疲労中の移動速度倍率(=操作性が重くなる)

    /** キャラ定義からゲーム内で使う倍率一式を作る */
    function makeProfile(char){
      return {
        id: char.id,
        speedMul: statMultiplier(char.stats.speed),
        powerMul: statMultiplier(char.stats.power),
        staminaStat: char.stats.stamina,
      };
    }

    // "serve" | "ballToPlayer" | "ballToOpponent" | "pointOver" | "gameOver"
    let phase = "serve";
    let duration = START_DURATION;

    const player = { x: 50, min: Court.X_MIN, max: Court.X_MAX };
    const opponent = { x: 50, targetX: 50, moving: false };
    const ball = { x:50, y:Court.OPPONENT_Y, fromX:50, fromY:Court.OPPONENT_Y,
      targetX:50, targetY:Court.PLAYER_Y, flightStart:0, flightDuration:START_DURATION };

    const keys = { left:false, right:false };
    let rafId = null;
    let autoMissTimer = null;
    let opponentReactAt = 0;

    // ---- 対戦カード(選んだキャラ・対戦相手)とstats由来のプロフィール。
    // begin()のたびに決め直す(対戦相手は3体以上いる場合ランダムに選ばれる) ----
    let playerChar = CHARACTERS[0], opponentChar = CHARACTERS[1];
    let playerProfile = makeProfile(playerChar), opponentProfile = makeProfile(opponentChar);
    let playerStamina = 100, opponentStamina = 100;
    let playerFatigued = false, opponentFatigued = false;

    // ---- 見た目(idle/run/swingポーズ + 左右反転)。ゲームロジックとは独立に
    // 「今動いているか(pose用)」と「最後にどちらを向いていたか(反転用。動きが
    // 止まってもidleで向きを保つ)」を分けて持つ。素材は左向きに描かれているため
    // 向きが右のときだけ反転する ----
    let playerMoving = false, playerFacing = -1;
    let opponentMoving = false, opponentFacing = -1;
    let playerSwingUntil = 0, opponentSwingUntil = 0;
    const playerVisual = { pose:null, flip:null };
    const opponentVisual = { pose:null, flip:null };

    function triggerSwing(side){
      const until = performance.now() + BOUNCE_MS;
      if (side === "player") playerSwingUntil = until; else opponentSwingUntil = until;
    }

    function applyVisual(state, imgEl, charId, pose, flip){
      if (state.pose !== pose) { imgEl.src = poseFile(charId, pose); state.pose = pose; }
      if (state.flip !== flip) { imgEl.style.setProperty("--flip", String(flip)); state.flip = flip; }
    }

    function updateVisuals(now){
      const e = el();
      const pSwing = now < playerSwingUntil;
      applyVisual(playerVisual, e.playerImg, selectedChar,
        pSwing ? "swing" : (playerMoving ? "run" : "idle"),
        playerFacing < 0 ? 1 : -1);

      const oSwing = now < opponentSwingUntil;
      applyVisual(opponentVisual, e.opponentImg, opponentChar.id,
        oSwing ? "swing" : (opponentMoving ? "run" : "idle"),
        opponentFacing < 0 ? 1 : -1);
    }

    const score = { player:0, opponent:0 };
    let lastLabels = scoreLabels(0, 0);
    let lastSmartReturn = false;

    function el(){
      return { ball: $("ball"), shadow: $("ballShadow"), hitZone: $("hitZone"),
        player: $("playerWrap"), opponent: $("opponentWrap"), flash: $("flash"),
        playerImg: $("playerImg"), opponentImg: $("opponentImg") };
    }

    /** 「今タップしたら実際にヒットする」かどうか。onAction()の成功条件と
        完全に同じ式にする(見た目の判定バー/ボールの光り方と、実際の成否が
        食い違わないようにするため)。 */
    function isHittableNow(now){
      if (phase !== "ballToPlayer") return false;
      const elapsed = now - ball.flightStart;
      const inWindow = elapsed >= (duration - WINDOW_MS) && elapsed <= (duration + GRACE_MS);
      return inWindow && canReach(player.x, ball.x);
    }

    function flash(kind){
      const f = el().flash;
      f.className = "flash " + kind;
      void f.offsetWidth;
      f.classList.add("show");
    }

    function bounce(wrap, kind){
      wrap.classList.remove("hit","miss","whiff");
      void wrap.offsetWidth;
      wrap.classList.add(kind);
      setTimeout(function(){ wrap.classList.remove(kind); }, BOUNCE_MS);
    }

    /** 自分側・相手側で共通の「届くか」判定 */
    function canReach(receiverX, ballX){
      return Math.abs(receiverX - ballX) <= REACH_RADIUS;
    }

    /** 打った瞬間の接触位置のズレから、打球の狙いどころを決める。
        ボールの左に立って打てば相手コートの右へ、右に立てば左へ飛ぶ
        (実際のテニスで体の入り方が打球方向を決めるのに近い)。
        aimDir(-1/0/+1)は打つ瞬間に押している左右キーで、押した方向に
        さらに狙いを寄せる(=プレイヤーが意図して打ち分けられるようにする)。 */
    function aimFromContact(receiverX, ballX, aimDir){
      const offset = receiverX - ballX;           // 概ね -REACH〜+REACH
      const target = 50 - offset * 2.6 + (aimDir || 0) * AIM_KEY_BIAS;
      return clamp(target, 6, 94);
    }

    /** かしこい返球: プレイヤーの現在位置から一番遠いコートの端を狙い、
        追いつくために大きく動かざるを得ない状況を作る。 */
    function aimAwayFromPlayer(playerX){
      return playerX < 50 ? 90 : 10;
    }

    function renderCourt(now){
      const e = el();
      e.player.style.left = Court.toCssX(player.x) + "%";
      e.opponent.style.left = Court.toCssX(opponent.x) + "%";

      if (phase === "ballToPlayer" || phase === "ballToOpponent") {
        const t = clamp((now - ball.flightStart) / ball.flightDuration, 0, 1);
        ball.x = lerp(ball.fromX, ball.targetX, t);
        ball.y = lerp(ball.fromY, ball.targetY, t);
        const hover = ARC_HEIGHT * 4 * t * (1 - t);
        const scale = 1 + hover / 140;

        e.ball.style.left = Court.toCssX(ball.x) + "%";
        e.ball.style.top = ball.y + "%";
        e.ball.style.transform = "translateY(-" + hover.toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";

        e.shadow.style.left = Court.toCssX(ball.x) + "%";
        e.shadow.style.top = ball.y + "%";
        e.shadow.style.opacity = String(clamp(1 - hover / ARC_HEIGHT, .15, 1));
        e.shadow.style.transform = "scale(" + clamp(1 - hover / (ARC_HEIGHT * 1.6), .4, 1).toFixed(2) + ")";
      }

      // 打てる範囲バー: ボールが自分に向かっているあいだだけ位置を追従表示し、
      // 実際にタップすればヒットする瞬間だけ強く光らせる(判定式と共通のisHittableNow)。
      e.hitZone.style.left = Court.toCssX(player.x) + "%";
      const ready = isHittableNow(now);
      e.hitZone.classList.toggle("visible", phase === "ballToPlayer");
      e.hitZone.classList.toggle("ready", ready);
      e.ball.classList.toggle("ready", ready);

      // スタミナバー(自分の分だけ画面に表示。相手側は内部状態のみ)
      const fill = $("staminaFill");
      fill.style.width = playerStamina + "%";
      fill.classList.toggle("low", playerFatigued);
    }

    /** スタミナを更新し、疲労状態(=速度が落ちる)かどうかを返す共通処理。
        movingは「このフレーム動く意思があるか」。stat=6が基準で、それより
        高いキャラは減りが遅く・回復が速い。 */
    function tickStamina(current, fatigued, staminaStat, moving, dtMs){
      let stamina = current;
      if (moving) {
        stamina = clamp(stamina - STAMINA_DRAIN_BASE * (STAT_BASELINE / staminaStat) * dtMs, 0, 100);
      } else {
        stamina = clamp(stamina + STAMINA_REGEN_BASE * (staminaStat / STAT_BASELINE) * dtMs, 0, 100);
      }
      let nowFatigued = fatigued;
      if (stamina <= 0) nowFatigued = true;
      else if (stamina >= FATIGUE_EXIT_PCT) nowFatigued = false;
      return { stamina: stamina, fatigued: nowFatigued };
    }

    /* ---- プレイヤー移動(常時。ラリー中でも移動できる)。speed statと、
       スタミナ切れ(疲労)で実際の移動速度が変わる ---- */
    function updatePlayer(dtMs){
      let dir = 0;
      if (keys.left) dir -= 1;
      if (keys.right) dir += 1;
      playerMoving = dir !== 0;
      if (dir !== 0) playerFacing = dir;

      const st = tickStamina(playerStamina, playerFatigued, playerProfile.staminaStat, playerMoving, dtMs);
      playerStamina = st.stamina; playerFatigued = st.fatigued;

      if (dir !== 0) {
        const fatigueMul = playerFatigued ? FATIGUE_SPEED_MULT : 1;
        const speed = PLAYER_SPEED * playerProfile.speedMul * fatigueMul;
        player.x = clamp(player.x + dir * speed * dtMs, player.min, player.max);
      }
    }

    /* ---- 相手AI(ballToOpponent の間だけ、予測着地Xへ向けて動く)。
       同じくspeed stat・スタミナ切れを反映する ---- */
    function updateOpponent(now, dtMs){
      const active = phase === "ballToOpponent" && now >= opponentReactAt;
      const wantsToMove = active && Math.abs(ball.targetX - opponent.x) > 0.01;
      const st = tickStamina(opponentStamina, opponentFatigued, opponentProfile.staminaStat, wantsToMove, dtMs);
      opponentStamina = st.stamina; opponentFatigued = st.fatigued;

      if (!active) { opponentMoving = false; return; }
      const fatigueMul = opponentFatigued ? FATIGUE_SPEED_MULT : 1;
      const dx = ball.targetX - opponent.x;
      const step = AI_SPEED * opponentProfile.speedMul * fatigueMul * dtMs;
      if (Math.abs(dx) <= step) { opponent.x = ball.targetX; opponentMoving = false; return; }
      const dir = Math.sign(dx);
      opponent.x += dir * step;
      opponentMoving = true;
      opponentFacing = dir;
    }

    function launchToPlayer(){
      phase = "ballToPlayer";
      ball.fromX = opponent.x; ball.fromY = Court.OPPONENT_Y;
      ball.targetX = clamp(player.x + (rand() - 0.5) * 30, 8, 92); // 相手の返球先(素朴なランダム)
      ball.targetY = Court.PLAYER_Y;
      ball.flightStart = performance.now();
      ball.flightDuration = duration;
      $("ball").classList.remove("hidden");

      clearTimeout(autoMissTimer);
      autoMissTimer = setTimeout(function(){
        if (phase === "ballToPlayer") miss();
      }, duration + GRACE_MS);
    }

    function launchToOpponent(targetX){
      phase = "ballToOpponent";
      ball.fromX = player.x; ball.fromY = Court.PLAYER_Y;
      ball.targetX = targetX;
      ball.targetY = Court.OPPONENT_Y;
      ball.flightStart = performance.now();
      ball.flightDuration = duration;
      opponentReactAt = ball.flightStart + AI_REACTION_MS;
    }

    function opponentArrives(){
      const reached = canReach(opponent.x, ball.targetX);
      if (!reached) { pointFor("player"); return; }
      bounce(el().opponent, "hit");
      triggerSwing("opponent");
      AudioFX.hit(opponentProfile.powerMul);
      lastSmartReturn = rand() < SMART_RETURN_CHANCE;
      const targetX = lastSmartReturn ? aimAwayFromPlayer(player.x) : aimFromContact(opponent.x, ball.targetX);
      setTimeout(function(){
        duration = Math.max(MIN_DURATION, duration - DURATION_STEP * opponentProfile.powerMul);
        phase = "ballToPlayer";
        ball.fromX = opponent.x; ball.fromY = Court.OPPONENT_Y;
        ball.targetX = clamp(targetX, 8, 92);
        ball.targetY = Court.PLAYER_Y;
        ball.flightStart = performance.now();
        ball.flightDuration = duration;
        $("ball").classList.remove("hidden");
        clearTimeout(autoMissTimer);
        autoMissTimer = setTimeout(function(){
          if (phase === "ballToPlayer") miss();
        }, duration + GRACE_MS);
      }, RETURN_PAUSE);
    }

    function onAction(){
      if (phase !== "ballToPlayer") return;
      const now = performance.now();
      const elapsed = now - ball.flightStart;
      const early = duration - WINDOW_MS;
      const late = duration + GRACE_MS;
      const inWindow = elapsed >= early && elapsed <= late;
      const inReach = canReach(player.x, ball.x);

      if (!inReach) { bounce(el().player, "whiff"); triggerSwing("player"); AudioFX.whiff(); miss(); return; }
      if (!inWindow) { bounce(el().player, "whiff"); triggerSwing("player"); AudioFX.whiff(); miss(); return; }
      hit();
    }

    function hit(){
      clearTimeout(autoMissTimer);
      flash("good");
      bounce(el().player, "hit");
      triggerSwing("player");
      AudioFX.hit(playerProfile.powerMul);
      let aimDir = 0;
      if (keys.left) aimDir -= 1;
      if (keys.right) aimDir += 1;
      const targetX = aimFromContact(player.x, ball.x, aimDir);
      duration = Math.max(MIN_DURATION, duration - DURATION_STEP * playerProfile.powerMul);
      launchToOpponent(targetX);
      setTimeout(function(){
        if (phase === "ballToOpponent") opponentArrives();
      }, duration);
    }

    function miss(){
      phase = "pointOver";
      clearTimeout(autoMissTimer);
      flash("bad");
      pointFor("opponent");
    }

    function pointFor(who){
      phase = "pointOver";
      score[who] += 1;
      lastLabels = scoreLabels(score.player, score.opponent);
      $("playerScore").textContent = lastLabels.forLabel;
      $("opponentScore").textContent = lastLabels.againstLabel;
      $("deuceNote").hidden = !lastLabels.deuce;
      if (!lastLabels.gameOver) AudioFX.point(who === "player");
      if (lastLabels.gameOver) {
        setTimeout(finish, 500);
      } else {
        setTimeout(function(){ phase = "serve"; launchToPlayer(); }, 500);
      }
    }

    function finish(){
      const win = lastLabels.winner === "for";
      $("rankVal").textContent = win ? "WIN" : "LOSE";
      $("resultPlayer").textContent = String(score.player);
      $("resultOpponent").textContent = String(score.opponent);
      show("result");
      stopLoop();
      AudioFX.stopBgm();
      AudioFX.gameEnd(win);
    }

    function begin(){
      score.player = 0; score.opponent = 0;
      lastLabels = scoreLabels(0, 0);
      lastSmartReturn = false;
      duration = START_DURATION;
      player.x = 50; opponent.x = 50;
      phase = "serve";
      $("playerScore").textContent = lastLabels.forLabel;
      $("opponentScore").textContent = lastLabels.againstLabel;
      $("deuceNote").hidden = true;
      playerMoving = false; playerFacing = -1; playerSwingUntil = 0;
      opponentMoving = false; opponentFacing = -1; opponentSwingUntil = 0;
      playerVisual.pose = null; playerVisual.flip = null;
      opponentVisual.pose = null; opponentVisual.flip = null;

      // 対戦カードを決め直す: 選んだキャラと、そのstatsから作った倍率一式、
      // 体格差(scale)を画像の表示幅に反映する。スタミナも満タンから始める。
      playerChar = findChar(selectedChar);
      opponentChar = pickOpponent(selectedChar, rand);
      playerProfile = makeProfile(playerChar);
      opponentProfile = makeProfile(opponentChar);
      playerStamina = 100; opponentStamina = 100;
      playerFatigued = false; opponentFatigued = false;
      const e0 = el();
      e0.playerImg.style.width = Math.round(92 * playerChar.scale) + "px";
      e0.opponentImg.style.width = Math.round(78 * opponentChar.scale) + "px";
      $("staminaFill").style.width = "100%";
      $("staminaFill").classList.remove("low");
      $("opponentName").textContent = opponentChar.name;

      updateVisuals(performance.now());
      el().player.classList.remove("hit","miss","whiff");
      el().opponent.classList.remove("hit","miss","whiff");
      $("ball").classList.remove("hidden","ready");
      $("hitZone").classList.remove("visible","ready");
      show("play");
      startLoop();
      setTimeout(launchToPlayer, 500);
    }

    let lastTick = 0;
    function loop(now){
      const dt = lastTick ? (now - lastTick) : 16;
      lastTick = now;
      updatePlayer(dt);
      updateOpponent(now, dt);
      renderCourt(now);
      updateVisuals(now);
      rafId = requestAnimationFrame(loop);
    }
    function startLoop(){ lastTick = 0; rafId = requestAnimationFrame(loop); }
    function stopLoop(){ if (rafId) cancelAnimationFrame(rafId); rafId = null; }

    function setKey(name, down){ keys[name] = down; }

    // Playwrightなど外部から検証できるように、判定に必要な状態を公開する
    // (RingGame/EchoGame の debugState() と同じ考え方)
    function debugState(){
      return {
        phase: phase,
        ball: { x: ball.x, y: ball.y, fromX: ball.fromX, fromY: ball.fromY,
          targetX: ball.targetX, targetY: ball.targetY,
          flightStart: ball.flightStart, flightDuration: ball.flightDuration },
        player: { x: player.x, min: player.min, max: player.max },
        opponent: { x: opponent.x, targetX: ball.targetX, smartReturn: lastSmartReturn },
        reachRadius: REACH_RADIUS,
        windowMs: WINDOW_MS, graceMs: GRACE_MS,
        playerChar: playerChar.id, opponentChar: opponentChar.id,
        playerProfile: playerProfile, opponentProfile: opponentProfile,
        playerStamina: playerStamina, playerFatigued: playerFatigued,
        opponentStamina: opponentStamina, opponentFatigued: opponentFatigued,
        score: {
          pointsPlayer: score.player, pointsOpponent: score.opponent,
          playerLabel: lastLabels.forLabel, opponentLabel: lastLabels.againstLabel,
          deuce: !!lastLabels.deuce, advantage: lastLabels.advantage || null,
          gameOver: !!lastLabels.gameOver, winner: lastLabels.winner || null,
        },
      };
    }

    return {
      begin: begin, onAction: onAction, setKey: setKey, debugState: debugState, setRng: setRng,
      scoreLabels: scoreLabels,
    };
  })();

  /* =========================================================
     7. 入力
     移動(左右キー/ボタン)は押している間ずっと有効、打つ(タップ/クリック/
     スペース)は1回きりのイベント。別の入力として扱う。
     ========================================================= */
  const KEY_MAP = { ArrowLeft:"left", a:"left", A:"left", ArrowRight:"right", d:"right", D:"right" };
  window.addEventListener("keydown", function(e){
    const dir = KEY_MAP[e.key];
    if (dir) { TennisGame.setKey(dir, true); e.preventDefault(); return; }
    if (e.code === "Space" && $("play").classList.contains("active")) {
      e.preventDefault();
      TennisGame.onAction();
    }
  });
  window.addEventListener("keyup", function(e){
    const dir = KEY_MAP[e.key];
    if (dir) { TennisGame.setKey(dir, false); e.preventDefault(); }
  });

  $("court").addEventListener("pointerdown", function(e){
    e.preventDefault();
    TennisGame.onAction();
  });

  function bindHold(btn, dir){
    const start = function(e){ e.preventDefault(); TennisGame.setKey(dir, true); };
    const end = function(e){ e.preventDefault(); TennisGame.setKey(dir, false); };
    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointerleave", end);
    btn.addEventListener("pointercancel", end);
  }
  bindHold($("btnLeft"), "left");
  bindHold($("btnRight"), "right");

  /* =========================================================
     8. 画面の行き来
     ========================================================= */
  // AudioContextの生成・再開はユーザー操作のハンドラの中で行う必要があるため、
  // BGM開始はここ(クリックハンドラ)から呼ぶ。
  $("startBtn").addEventListener("click", function(){ AudioFX.startBgm(); TennisGame.begin(); });
  $("retryBtn").addEventListener("click", function(){ AudioFX.startBgm(); TennisGame.begin(); });
  $("titleBtn").addEventListener("click", function(){ AudioFX.stopBgm(); show("title"); });

  paintCharRow();
  show("title");

  window.__tennis = TennisGame; // Playwright検証用
})();
</script>
</body>
</html>
