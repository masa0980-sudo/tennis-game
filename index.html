<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コート・ラリー</title>
<style>
  :root{
    color-scheme: dark;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --danger:#f87171;
    --good:#34d399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0b1020; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
  #app{ position:relative; min-height:100dvh; width:100%; overflow:hidden; touch-action:none; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center; }
  .screen.active{ display:flex; }

  h1{ font-size:28px; margin:0; letter-spacing:.02em; }
  .sub{ color:#9aa4c4; font-size:13px; margin:0; }

  .charRow{ display:flex; gap:16px; }
  .charBtn{ background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14);
    border-radius:18px; padding:14px; display:flex; flex-direction:column; align-items:center;
    gap:8px; cursor:pointer; color:#fff; width:130px; }
  .charBtn img{ width:88px; height:auto; image-rendering:-webkit-optimize-contrast; }
  .charBtn.selected{ border-color:var(--accent); box-shadow:0 0 22px rgba(56,189,248,.45);
    background:rgba(56,189,248,.12); }
  .charBtn .cname{ font-size:13px; font-weight:700; }

  .bigBtn{ padding:16px 40px; border-radius:16px; border:none; font-size:18px; font-weight:800;
    color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 24px rgba(56,189,248,.4); cursor:pointer; }
  .bigBtn:active{ transform:scale(.96); }
  .ghostBtn{ padding:10px 22px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05); color:#fff; font-size:14px; cursor:pointer; }

  /* ===== プレイ画面 ===== */
  #play{ justify-content:space-between; padding:16px 12px 24px; }
  .hud{ display:flex; justify-content:space-between; width:100%; max-width:460px;
    font-variant-numeric:tabular-nums; font-size:12px; color:#9aa4c4; }
  .hud b{ color:#fff; font-size:26px; display:block; }
  .hud .you b{ color:#7dd3fc; }
  .hud .cpu b{ color:#f0abfc; }

  /* テニスコート風の背景。芝(グリーン)の地に、シングルスのサイドライン・
     サービスラインを白線で描く。実寸どおりの比率ではなく、あくまで
     「テニスコートらしく見える」ことを優先した簡略デザイン */
  .court{ position:relative; width:100%; max-width:460px; flex:1; margin:8px 0;
    background:
      linear-gradient(transparent 0 30%, rgba(255,255,255,.4) 30% calc(30% + 2px), transparent calc(30% + 2px) 100%),
      linear-gradient(transparent 0 70%, rgba(255,255,255,.4) 70% calc(70% + 2px), transparent calc(70% + 2px) 100%),
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.4) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 30% / 100% 40% no-repeat,
      linear-gradient(90deg,
        transparent 0 10%, rgba(255,255,255,.55) 10% calc(10% + 2px), transparent calc(10% + 2px) 90%,
        rgba(255,255,255,.55) 90% calc(90% + 2px), transparent calc(90% + 2px) 100%),
      linear-gradient(180deg, #1f6b4f, #1c6349 40%, #14432f);
    border:3px solid rgba(255,255,255,.6); border-radius:14px; overflow:hidden; }
  .netLine{ position:absolute; left:6%; right:6%; top:48%; height:6px; margin-top:-3px;
    background:
      repeating-linear-gradient(90deg, rgba(10,20,15,.9) 0 6px, transparent 6px 7px),
      linear-gradient(#fff, #fff) top / 100% 2px no-repeat,
      #0d1f17;
    box-shadow:0 2px 4px rgba(0,0,0,.4); z-index:2; }

  .ballShadow{ position:absolute; width:22px; height:8px; margin-left:-11px; margin-top:-4px;
    border-radius:50%; background:rgba(0,0,0,.35); filter:blur(1px); z-index:3; }
  .ball{ position:absolute; width:22px; height:22px; margin-left:-11px; margin-top:-11px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #ffd54a 55%, #f3a712 100%);
    box-shadow:0 0 10px rgba(255,213,74,.7); z-index:4; }
  .ball.hidden{ opacity:0; }

  /* 自分の「届く範囲」。プレイヤーの現在位置に追従し、ボールが自分の番の
     ときだけ光る(=そろそろ打てる、が視覚的にわかる) */
  .reach{ position:absolute; bottom:16%; width:30%; max-width:150px; height:26px;
    margin-left:-15%; border:2px dashed rgba(255,255,255,.3); border-radius:999px; z-index:1;
    transition: left .05s linear; }
  .reach.armed{ border-color:var(--accent); box-shadow:0 0 16px rgba(56,189,248,.5); }

  .charWrap{ position:absolute; z-index:5; transition:left .05s linear; }
  .charWrap img{ width:88px; height:auto; transition: transform .12s; }
  .charWrap.hit img{ transform: scale(1.16) rotate(-6deg); }
  .charWrap.miss img{ transform: scale(.92) rotate(8deg); filter:grayscale(.5); }
  .charWrap.whiff img{ transform: rotate(-14deg); }

  .playerWrap{ bottom:2%; transform:translateX(-50%); }
  .playerWrap img{ width:92px; }
  .playerWrap.hit img{ transform: scale(1.18) rotate(-6deg); }

  .opponentWrap{ top:2%; transform:translateX(-50%); }
  .opponentWrap img{ width:78px; }
  .opponentWrap.hit img{ transform: scale(1.18) rotate(6deg); }

  .racket{ position:absolute; width:28px; height:48px; pointer-events:none;
    transition: transform .16s cubic-bezier(.2,1.4,.4,1); }
  .racket svg{ width:100%; height:100%; display:block; }

  .playerRacket{ right:-6px; bottom:24px; transform-origin:50% 92%; transform:rotate(28deg); }
  .playerWrap.hit .playerRacket{ transform:rotate(-95deg); }
  .playerWrap.whiff .playerRacket{ transform:rotate(-70deg); }

  .opponentRacket{ left:-6px; top:24px; transform-origin:50% 8%; transform:rotate(-28deg) scale(-1,-1); }
  .opponentWrap.hit .opponentRacket{ transform:rotate(95deg) scale(-1,-1); }

  .tapHint{ font-size:12px; color:#9aa4c4; }

  .flash{ position:absolute; inset:0; pointer-events:none; opacity:0; z-index:6; }
  .flash.good{ background:rgba(52,211,153,.18); }
  .flash.bad{ background:rgba(248,113,113,.22); }
  .flash.show{ animation: flashOut .3s ease-out; }
  @keyframes flashOut{ from{ opacity:1; } to{ opacity:0; } }

  .moveButtons{ display:flex; gap:10px; margin-top:4px; }
  .moveBtn{ width:56px; height:44px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06); color:#fff; font-size:20px; touch-action:manipulation; }
  .moveBtn:active{ background:rgba(56,189,248,.25); }

  #result .rank{ font-size:40px; font-weight:900; margin:0; }
  #result .score{ font-size:15px; color:#9aa4c4; }
  #result .score b{ color:#fff; font-size:28px; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= タイトル(キャラクター選択) ================= -->
  <section id="title" class="screen active">
    <h1>コート・ラリー</h1>
    <p class="sub">左右に動いてボールに合わせ、タイミングよく打ち返そう。</p>
    <div class="charRow" id="charRow"></div>
    <button class="bigBtn" id="startBtn">はじめる</button>
    <p class="tapHint">← → / A D で移動　・　タップ / クリック / スペースで打つ</p>
  </section>

  <!-- ================= プレイ ================= -->
  <section id="play" class="screen">
    <div class="hud">
      <span class="you">あなた<b id="playerScore">0</b></span>
      <span class="cpu">相手<b id="opponentScore">0</b></span>
    </div>
    <div class="court" id="court">
      <div class="netLine"></div>
      <div class="opponentWrap charWrap" id="opponentWrap">
        <img id="opponentImg" alt="">
        <div class="racket opponentRacket">
          <svg viewBox="0 0 30 52" aria-hidden="true">
            <ellipse cx="15" cy="16" rx="12" ry="15" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
            <path d="M6 16H24M15 3V29M9 8L21 24M21 8L9 24" stroke="#e5e7eb" stroke-width=".8" opacity=".6"/>
            <rect x="12" y="30" width="6" height="20" rx="3" fill="#b5773a"/>
          </svg>
        </div>
      </div>
      <div class="reach" id="reach"></div>
      <div class="ballShadow" id="ballShadow"></div>
      <div class="ball" id="ball"></div>
      <div class="playerWrap charWrap" id="playerWrap">
        <img id="playerImg" alt="">
        <div class="racket playerRacket">
          <svg viewBox="0 0 30 52" aria-hidden="true">
            <ellipse cx="15" cy="16" rx="12" ry="15" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
            <path d="M6 16H24M15 3V29M9 8L21 24M21 8L9 24" stroke="#e5e7eb" stroke-width=".8" opacity=".6"/>
            <rect x="12" y="30" width="6" height="20" rx="3" fill="#b5773a"/>
          </svg>
        </div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
    <p class="tapHint">← → / A D で移動・タップで打つ</p>
    <div class="moveButtons" id="moveButtons">
      <button class="moveBtn" id="btnLeft">◀</button>
      <button class="moveBtn" id="btnRight">▶</button>
    </div>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="screen">
    <span class="sub">RESULT</span>
    <p class="rank" id="rankVal">-</p>
    <p class="score">あなた <b id="resultPlayer">0</b> ー <b id="resultOpponent">0</b> 相手</p>
    <button class="bigBtn" id="retryBtn">もう一度</button>
    <button class="ghostBtn" id="titleBtn">キャラを選び直す</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     0. 小道具
     ========================================================= */
  function $(id){ return document.getElementById(id); }
  const SCREENS = ["title","play","result"];
  function show(id){
    SCREENS.forEach(function(s){
      $(s).classList.toggle("active", s === id);
    });
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t){ return a + (b - a) * t; }

  /* =========================================================
     1. キャラクター
     ========================================================= */
  // 画像は LINEスタンプ(stamp_01_funifuni2026.png / stamp_02_kotokoto2026.png)から
  // 1ポーズだけ切り出したもの。スポーティなキャラ絵に差し替える予定だが、
  // 素材が届くまではこの仮素材で操作感を作る(ポーズはCSSクラスで切り替えられる
  // 構造にしてあるので、差し替え自体は画像パスの変更だけで済む)。
  const CHARACTERS = [
    { id:"funifuni", name:"ふにふに", file:"art/funifuni.png" },
    { id:"kotokoto", name:"ことこと", file:"art/kotokoto.png" }
  ];
  const CHAR_KEY = "tennis-game:character";
  let selectedChar = localStorage.getItem(CHAR_KEY) || CHARACTERS[0].id;

  function paintCharRow(){
    const box = $("charRow");
    box.innerHTML = "";
    CHARACTERS.forEach(function(c){
      const btn = document.createElement("button");
      btn.className = "charBtn" + (c.id === selectedChar ? " selected" : "");
      btn.innerHTML = '<img src="' + c.file + '" alt="' + c.name + '">' +
        '<span class="cname">' + c.name + '</span>';
      btn.addEventListener("click", function(){
        selectedChar = c.id;
        localStorage.setItem(CHAR_KEY, selectedChar);
        paintCharRow();
      });
      box.appendChild(btn);
    });
  }

  function charFile(id){
    const c = CHARACTERS.find(function(x){ return x.id === id; });
    return c ? c.file : CHARACTERS[0].file;
  }
  function opponentFile(id){
    const opp = CHARACTERS.find(function(x){ return x.id !== id; });
    return opp ? opp.file : CHARACTERS[1].file;
  }

  /* =========================================================
     2. Court — 座標系だけを持つ小さなモジュール(DOM非依存)
     論理X座標は0〜100。見切れないよう、CSS上は15%〜85%の帯に写像する。
     前後移動は無く(=奥行きは今回のスコープ外)、左右移動だけを扱う。
     ========================================================= */
  const Court = {
    X_MIN: 0, X_MAX: 100,
    CSS_MIN: 15, CSS_MAX: 85,
    PLAYER_Y: 88,     // 自分の打点(コート下端寄り、%)
    OPPONENT_Y: 9,    // 相手の打点(コート上端寄り、%)
    toCssX: function(x){ return Court.CSS_MIN + (Court.CSS_MAX - Court.CSS_MIN) * (x / 100); },
  };

  /* =========================================================
     3. Rng — 差し替え可能な乱数(Playwrightから相手の挙動を固定できるようにする)
     ========================================================= */
  let rand = Math.random;
  function setRng(fn){ rand = (typeof fn === "function") ? fn : Math.random; }

  /* =========================================================
     4. スコア(ベスト勝率などは今回スコープ外。1ゲームの勝敗だけを見る)
     ========================================================= */
  const WIN_POINTS = 5; // 先に5ポイント取った方の勝ち(本物のテニス採点は次段階で入れる)

  /* =========================================================
     5. ゲーム本体
     ========================================================= */
  const TennisGame = (function(){
    const REACH_RADIUS = 17;        // 届く範囲(論理単位。0〜100スケール)
    const PLAYER_SPEED = 0.085;     // 論理単位/ms
    const AI_SPEED = 0.072;         // 相手の上限速度(自分よりわずかに遅い=勝ち筋がある)
    const AI_REACTION_MS = 140;     // 相手が動き出すまでの反応遅延
    const START_DURATION = 1200;    // 最初の到達時間(ms)
    const MIN_DURATION = 680;
    const DURATION_STEP = 45;
    const WINDOW_MS = 220;          // 到達時刻より前、これだけ早くから成功にする
    const GRACE_MS = 120;           // 到達時刻より後、これだけ遅くても成功にする
    const ARC_HEIGHT = 42;          // ボールの山なり演出(px)
    const RETURN_PAUSE = 160;

    // "serve" | "ballToPlayer" | "ballToOpponent" | "pointOver" | "gameOver"
    let phase = "serve";
    let duration = START_DURATION;

    const player = { x: 50, min: Court.X_MIN, max: Court.X_MAX };
    const opponent = { x: 50, targetX: 50, moving: false };
    const ball = { x:50, y:Court.OPPONENT_Y, fromX:50, fromY:Court.OPPONENT_Y,
      targetX:50, targetY:Court.PLAYER_Y, flightStart:0, flightDuration:START_DURATION };

    const keys = { left:false, right:false };
    let rafId = null;
    let autoMissTimer = null;
    let opponentReactAt = 0;

    const score = { player:0, opponent:0 };

    function el(){
      return { ball: $("ball"), shadow: $("ballShadow"), reach: $("reach"),
        player: $("playerWrap"), opponent: $("opponentWrap"), flash: $("flash") };
    }

    function flash(kind){
      const f = el().flash;
      f.className = "flash " + kind;
      void f.offsetWidth;
      f.classList.add("show");
    }

    function bounce(wrap, kind){
      wrap.classList.remove("hit","miss","whiff");
      void wrap.offsetWidth;
      wrap.classList.add(kind);
      setTimeout(function(){ wrap.classList.remove(kind); }, 180);
    }

    /** 自分側・相手側で共通の「届くか」判定 */
    function canReach(receiverX, ballX){
      return Math.abs(receiverX - ballX) <= REACH_RADIUS;
    }

    /** 打った瞬間の接触位置のズレから、打球の狙いどころを決める。
        ボールの左に立って打てば相手コートの右へ、右に立てば左へ飛ぶ
        (実際のテニスで体の入り方が打球方向を決めるのに近い)。 */
    function aimFromContact(receiverX, ballX){
      const offset = receiverX - ballX;           // 概ね -REACH〜+REACH
      const target = 50 - offset * 2.6;
      return clamp(target, 6, 94);
    }

    function renderCourt(now){
      const e = el();
      e.player.style.left = Court.toCssX(player.x) + "%";
      e.opponent.style.left = Court.toCssX(opponent.x) + "%";
      e.reach.style.left = Court.toCssX(player.x) + "%";

      if (phase === "ballToPlayer" || phase === "ballToOpponent") {
        const t = clamp((now - ball.flightStart) / ball.flightDuration, 0, 1);
        ball.x = lerp(ball.fromX, ball.targetX, t);
        ball.y = lerp(ball.fromY, ball.targetY, t);
        const hover = ARC_HEIGHT * 4 * t * (1 - t);
        const scale = 1 + hover / 140;

        e.ball.style.left = Court.toCssX(ball.x) + "%";
        e.ball.style.top = ball.y + "%";
        e.ball.style.transform = "translateY(-" + hover.toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";

        e.shadow.style.left = Court.toCssX(ball.x) + "%";
        e.shadow.style.top = ball.y + "%";
        e.shadow.style.opacity = String(clamp(1 - hover / ARC_HEIGHT, .15, 1));
        e.shadow.style.transform = "scale(" + clamp(1 - hover / (ARC_HEIGHT * 1.6), .4, 1).toFixed(2) + ")";
      }
    }

    /* ---- プレイヤー移動(常時。ラリー中でも移動できる) ---- */
    function updatePlayer(dtMs){
      let dir = 0;
      if (keys.left) dir -= 1;
      if (keys.right) dir += 1;
      if (dir !== 0) player.x = clamp(player.x + dir * PLAYER_SPEED * dtMs, player.min, player.max);
    }

    /* ---- 相手AI(ballToOpponent の間だけ、予測着地Xへ向けて動く) ---- */
    function updateOpponent(now, dtMs){
      if (phase !== "ballToOpponent") return;
      if (now < opponentReactAt) return;
      const dx = ball.targetX - opponent.x;
      const step = AI_SPEED * dtMs;
      if (Math.abs(dx) <= step) opponent.x = ball.targetX;
      else opponent.x += Math.sign(dx) * step;
    }

    function launchToPlayer(){
      phase = "ballToPlayer";
      ball.fromX = opponent.x; ball.fromY = Court.OPPONENT_Y;
      ball.targetX = clamp(player.x + (rand() - 0.5) * 30, 8, 92); // 相手の返球先(素朴なランダム)
      ball.targetY = Court.PLAYER_Y;
      ball.flightStart = performance.now();
      ball.flightDuration = duration;
      $("ball").classList.remove("hidden");
      $("reach").classList.add("armed");

      clearTimeout(autoMissTimer);
      autoMissTimer = setTimeout(function(){
        if (phase === "ballToPlayer") miss();
      }, duration + GRACE_MS);
    }

    function launchToOpponent(targetX){
      phase = "ballToOpponent";
      ball.fromX = player.x; ball.fromY = Court.PLAYER_Y;
      ball.targetX = targetX;
      ball.targetY = Court.OPPONENT_Y;
      ball.flightStart = performance.now();
      ball.flightDuration = duration;
      opponentReactAt = ball.flightStart + AI_REACTION_MS;
      $("reach").classList.remove("armed");
    }

    function opponentArrives(){
      const reached = canReach(opponent.x, ball.targetX);
      if (!reached) { pointFor("player"); return; }
      bounce(el().opponent, "hit");
      const targetX = aimFromContact(opponent.x, ball.targetX);
      setTimeout(function(){
        duration = Math.max(MIN_DURATION, duration - DURATION_STEP);
        phase = "ballToPlayer";
        ball.fromX = opponent.x; ball.fromY = Court.OPPONENT_Y;
        ball.targetX = clamp(targetX, 8, 92);
        ball.targetY = Court.PLAYER_Y;
        ball.flightStart = performance.now();
        ball.flightDuration = duration;
        $("ball").classList.remove("hidden");
        $("reach").classList.add("armed");
        clearTimeout(autoMissTimer);
        autoMissTimer = setTimeout(function(){
          if (phase === "ballToPlayer") miss();
        }, duration + GRACE_MS);
      }, RETURN_PAUSE);
    }

    function onAction(){
      if (phase !== "ballToPlayer") return;
      const now = performance.now();
      const elapsed = now - ball.flightStart;
      const early = duration - WINDOW_MS;
      const late = duration + GRACE_MS;
      const inWindow = elapsed >= early && elapsed <= late;
      const inReach = canReach(player.x, ball.x);

      if (!inReach) { bounce(el().player, "whiff"); miss(); return; }
      if (!inWindow) { bounce(el().player, "whiff"); miss(); return; }
      hit();
    }

    function hit(){
      clearTimeout(autoMissTimer);
      flash("good");
      bounce(el().player, "hit");
      const targetX = aimFromContact(player.x, ball.x);
      duration = Math.max(MIN_DURATION, duration - DURATION_STEP);
      launchToOpponent(targetX);
      setTimeout(function(){
        if (phase === "ballToOpponent") opponentArrives();
      }, duration);
    }

    function miss(){
      phase = "pointOver";
      clearTimeout(autoMissTimer);
      flash("bad");
      $("reach").classList.remove("armed");
      pointFor("opponent");
    }

    function pointFor(who){
      phase = "pointOver";
      score[who] += 1;
      $("playerScore").textContent = String(score.player);
      $("opponentScore").textContent = String(score.opponent);
      if (score.player >= WIN_POINTS || score.opponent >= WIN_POINTS) {
        setTimeout(finish, 500);
      } else {
        setTimeout(function(){ phase = "serve"; launchToPlayer(); }, 500);
      }
    }

    function finish(){
      const win = score.player > score.opponent;
      $("rankVal").textContent = win ? "WIN" : "LOSE";
      $("resultPlayer").textContent = String(score.player);
      $("resultOpponent").textContent = String(score.opponent);
      show("result");
      stopLoop();
    }

    function begin(){
      score.player = 0; score.opponent = 0;
      duration = START_DURATION;
      player.x = 50; opponent.x = 50;
      phase = "serve";
      $("playerScore").textContent = "0";
      $("opponentScore").textContent = "0";
      $("playerImg").src = charFile(selectedChar);
      $("opponentImg").src = opponentFile(selectedChar);
      el().player.classList.remove("hit","miss","whiff");
      el().opponent.classList.remove("hit","miss","whiff");
      $("reach").classList.remove("armed");
      $("ball").classList.remove("hidden");
      show("play");
      startLoop();
      setTimeout(launchToPlayer, 500);
    }

    let lastTick = 0;
    function loop(now){
      const dt = lastTick ? (now - lastTick) : 16;
      lastTick = now;
      updatePlayer(dt);
      updateOpponent(now, dt);
      renderCourt(now);
      rafId = requestAnimationFrame(loop);
    }
    function startLoop(){ lastTick = 0; rafId = requestAnimationFrame(loop); }
    function stopLoop(){ if (rafId) cancelAnimationFrame(rafId); rafId = null; }

    function setKey(name, down){ keys[name] = down; }

    // Playwrightなど外部から検証できるように、判定に必要な状態を公開する
    // (RingGame/EchoGame の debugState() と同じ考え方)
    function debugState(){
      return {
        phase: phase,
        ball: { x: ball.x, y: ball.y, fromX: ball.fromX, fromY: ball.fromY,
          targetX: ball.targetX, targetY: ball.targetY,
          flightStart: ball.flightStart, flightDuration: ball.flightDuration },
        player: { x: player.x, min: player.min, max: player.max },
        opponent: { x: opponent.x, targetX: ball.targetX },
        reachRadius: REACH_RADIUS,
        windowMs: WINDOW_MS, graceMs: GRACE_MS,
        score: { player: score.player, opponent: score.opponent },
      };
    }

    return { begin: begin, onAction: onAction, setKey: setKey, debugState: debugState, setRng: setRng };
  })();

  /* =========================================================
     6. 入力
     移動(左右キー/ボタン)は押している間ずっと有効、打つ(タップ/クリック/
     スペース)は1回きりのイベント。別の入力として扱う。
     ========================================================= */
  const KEY_MAP = { ArrowLeft:"left", a:"left", A:"left", ArrowRight:"right", d:"right", D:"right" };
  window.addEventListener("keydown", function(e){
    const dir = KEY_MAP[e.key];
    if (dir) { TennisGame.setKey(dir, true); e.preventDefault(); return; }
    if (e.code === "Space" && $("play").classList.contains("active")) {
      e.preventDefault();
      TennisGame.onAction();
    }
  });
  window.addEventListener("keyup", function(e){
    const dir = KEY_MAP[e.key];
    if (dir) { TennisGame.setKey(dir, false); e.preventDefault(); }
  });

  $("court").addEventListener("pointerdown", function(e){
    e.preventDefault();
    TennisGame.onAction();
  });

  function bindHold(btn, dir){
    const start = function(e){ e.preventDefault(); TennisGame.setKey(dir, true); };
    const end = function(e){ e.preventDefault(); TennisGame.setKey(dir, false); };
    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointerleave", end);
    btn.addEventListener("pointercancel", end);
  }
  bindHold($("btnLeft"), "left");
  bindHold($("btnRight"), "right");

  /* =========================================================
     7. 画面の行き来
     ========================================================= */
  $("startBtn").addEventListener("click", function(){ TennisGame.begin(); });
  $("retryBtn").addEventListener("click", function(){ TennisGame.begin(); });
  $("titleBtn").addEventListener("click", function(){ show("title"); });

  paintCharRow();
  show("title");

  window.__tennis = TennisGame; // Playwright検証用
})();
</script>
</body>
