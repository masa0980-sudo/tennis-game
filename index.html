<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タイミングテニス</title>
<style>
  :root{
    color-scheme: dark;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --danger:#f87171;
    --good:#34d399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0b1020; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
  #app{ position:relative; min-height:100dvh; width:100%; overflow:hidden; touch-action:manipulation; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center; }
  .screen.active{ display:flex; }

  h1{ font-size:28px; margin:0; letter-spacing:.02em; }
  .sub{ color:#9aa4c4; font-size:13px; margin:0; }

  .charRow{ display:flex; gap:16px; }
  .charBtn{ background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14);
    border-radius:18px; padding:14px; display:flex; flex-direction:column; align-items:center;
    gap:8px; cursor:pointer; color:#fff; width:130px; }
  .charBtn img{ width:88px; height:auto; image-rendering:-webkit-optimize-contrast; }
  .charBtn.selected{ border-color:var(--accent); box-shadow:0 0 22px rgba(56,189,248,.45);
    background:rgba(56,189,248,.12); }
  .charBtn .cname{ font-size:13px; font-weight:700; }

  .bigBtn{ padding:16px 40px; border-radius:16px; border:none; font-size:18px; font-weight:800;
    color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 24px rgba(56,189,248,.4); cursor:pointer; }
  .bigBtn:active{ transform:scale(.96); }
  .ghostBtn{ padding:10px 22px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05); color:#fff; font-size:14px; cursor:pointer; }

  /* ===== プレイ画面 ===== */
  #play{ justify-content:space-between; padding:20px 16px 40px; }
  .hud{ display:flex; justify-content:space-between; width:100%; max-width:420px;
    font-variant-numeric:tabular-nums; font-size:13px; color:#9aa4c4; }
  .hud b{ color:#fff; font-size:20px; display:block; }

  .court{ position:relative; width:100%; max-width:420px; flex:1; margin:8px 0;
    background:
      linear-gradient(180deg, rgba(56,189,248,.06), transparent 40%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 40px);
    border:1px solid rgba(255,255,255,.12); border-radius:20px; overflow:hidden; }
  .netLine{ position:absolute; left:8%; right:8%; top:14%; height:2px;
    background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 16px); opacity:.5; }

  .ball{ position:absolute; left:50%; top:10%; width:26px; height:26px; margin-left:-13px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #ffd54a 55%, #f3a712 100%);
    box-shadow:0 0 10px rgba(255,213,74,.7); transition: top linear, opacity .15s;
  }
  .ball.hidden{ opacity:0; }

  .zone{ position:absolute; left:50%; bottom:14%; width:120px; height:24px; margin-left:-60px;
    border:2px dashed rgba(255,255,255,.3); border-radius:999px; }
  .zone.armed{ border-color:var(--accent); box-shadow:0 0 16px rgba(56,189,248,.5); }

  /* キャラが左右にゆらゆら動き続ける演出。ゾーン中央からの追加オフセットとして
     translateX(-50%)の後ろに重ねるので、中央寄せの位置決めとは干渉しない */
  @keyframes swayPlayer{
    0%, 100% { transform: translateX(-50%) translateX(-34px); }
    50%      { transform: translateX(-50%) translateX(34px); }
  }
  @keyframes swayOpponent{
    0%, 100% { transform: translateX(-50%) translateX(28px); }
    50%      { transform: translateX(-50%) translateX(-28px); }
  }

  .playerWrap{ position:absolute; left:50%; bottom:2%;
    animation: swayPlayer 2.4s ease-in-out infinite; }
  .playerWrap img{ width:96px; height:auto; transition: transform .12s; }
  .playerWrap.hit img{ transform: scale(1.18) rotate(-6deg); }
  .playerWrap.miss img{ transform: scale(.9) rotate(8deg); filter:grayscale(.5); }

  /* 相手キャラ。自分側(.playerWrap)と対になる位置(画面上端)に置く。
     顔を上下逆さにすると表情が崩れるので、向きはそのままにする。
     自分側と揺れの向き・周期をずらして、動きが合わせ鏡にならないようにしている */
  .opponentWrap{ position:absolute; left:50%; top:2%;
    animation: swayOpponent 2.8s ease-in-out infinite; }
  .opponentWrap img{ width:80px; height:auto; transition: transform .12s; }
  .opponentWrap.hit img{ transform: scale(1.18) rotate(6deg); }

  .tapHint{ font-size:12px; color:#9aa4c4; }

  .flash{ position:absolute; inset:0; pointer-events:none; opacity:0; }
  .flash.good{ background:rgba(52,211,153,.18); }
  .flash.bad{ background:rgba(248,113,113,.22); }
  .flash.show{ animation: flashOut .3s ease-out; }
  @keyframes flashOut{ from{ opacity:1; } to{ opacity:0; } }

  #result .rank{ font-size:56px; font-weight:900; margin:0; }
  #result .score{ font-size:15px; color:#9aa4c4; }
  #result .score b{ color:#fff; font-size:28px; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= タイトル(キャラクター選択) ================= -->
  <section id="title" class="screen active">
    <h1>タイミングテニス</h1>
    <p class="sub">ボールが来た瞬間にタップして打ち返そう。続くほど速くなる。</p>
    <div class="charRow" id="charRow"></div>
    <button class="bigBtn" id="startBtn">はじめる</button>
    <p class="tapHint">タップ / クリック / スペースキーで打ち返す</p>
  </section>

  <!-- ================= プレイ ================= -->
  <section id="play" class="screen">
    <div class="hud">
      <span>ラリー<b id="rallyVal">0</b></span>
      <span>ベスト<b id="bestVal">0</b></span>
    </div>
    <div class="court" id="court">
      <div class="netLine"></div>
      <div class="opponentWrap" id="opponentWrap"><img id="opponentImg" alt=""></div>
      <div class="zone" id="zone"></div>
      <div class="ball" id="ball"></div>
      <div class="playerWrap" id="playerWrap"><img id="playerImg" alt=""></div>
      <div class="flash" id="flash"></div>
    </div>
    <p class="tapHint">ボールがゾーンに重なった瞬間にタップ</p>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="screen">
    <span class="sub">RESULT</span>
    <p class="rank" id="rankVal">0</p>
    <p class="score">ラリー <b id="resultRally">0</b> 回 ／ ベスト <b id="resultBest">0</b> 回</p>
    <button class="bigBtn" id="retryBtn">もう一度</button>
    <button class="ghostBtn" id="titleBtn">キャラを選び直す</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     0. 小道具
     ========================================================= */
  function $(id){ return document.getElementById(id); }
  const SCREENS = ["title","play","result"];
  function show(id){
    SCREENS.forEach(function(s){
      $(s).classList.toggle("active", s === id);
    });
  }

  /* =========================================================
     1. キャラクター
     ========================================================= */
  // 画像は LINEスタンプ(stamp_01_funifuni2026.png / stamp_02_kotokoto2026.png)から
  // 1ポーズだけ切り出したもの。元が60x60pxのスタンプなので、あまり大きく
  // 表示しすぎるとぼやける(96px角程度を上限にしている)。
  const CHARACTERS = [
    { id:"funifuni", name:"ふにふに", file:"art/funifuni.png" },
    { id:"kotokoto", name:"ことこと", file:"art/kotokoto.png" }
  ];
  const CHAR_KEY = "tennis-game:character";
  let selectedChar = localStorage.getItem(CHAR_KEY) || CHARACTERS[0].id;

  function paintCharRow(){
    const box = $("charRow");
    box.innerHTML = "";
    CHARACTERS.forEach(function(c){
      const btn = document.createElement("button");
      btn.className = "charBtn" + (c.id === selectedChar ? " selected" : "");
      btn.innerHTML = '<img src="' + c.file + '" alt="' + c.name + '">' +
        '<span class="cname">' + c.name + '</span>';
      btn.addEventListener("click", function(){
        selectedChar = c.id;
        localStorage.setItem(CHAR_KEY, selectedChar);
        paintCharRow();
      });
      box.appendChild(btn);
    });
  }

  function charFile(id){
    const c = CHARACTERS.find(function(x){ return x.id === id; });
    return c ? c.file : CHARACTERS[0].file;
  }

  // 相手は「選ばなかった方」を自動で採用する(2体しかいないので選択UIは要らない)
  function opponentFile(id){
    const opp = CHARACTERS.find(function(x){ return x.id !== id; });
    return opp ? opp.file : CHARACTERS[1].file;
  }

  /* =========================================================
     2. スコア(ベスト)
     ========================================================= */
  const BEST_KEY = "tennis-game:best";
  function loadBest(){
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v){
    try { localStorage.setItem(BEST_KEY, String(v)); }
    catch (e) { /* 保存できなくても続行できる */ }
  }

  /* =========================================================
     3. ゲーム本体
     自分と相手、両方のキャラを画面に出し、ボールを打ち合っているように見せる。
     ただしタイミング判定があるのは自分の番(toPlayer)だけ。相手は必ず打ち返す
     (相手のミスは無い)。BGM・コンボ表示などのさらなる演出は今回のスコープ外。
     ========================================================= */
  const TennisGame = (function(){
    const START_DURATION = 1300;   // 最初のボール到達までの時間(ms)
    const MIN_DURATION = 480;      // これより速くはしない
    const DURATION_STEP = 55;      // 1回成功するごとに詰める量(ms)
    const WINDOW_MS = 230;         // 到達時刻より前、これだけ早くから成功にする
    const GRACE_MS = 110;          // 到達時刻より後、これだけ遅くても成功にする
    const OPPONENT_Y = "10%";      // ボールの相手側の折り返し位置
    const PLAYER_Y = "78%";        // ボールの自分側の折り返し位置(=zoneの位置)
    const RETURN_PAUSE = 180;      // 相手が打ち返すまでの間(演出用の一呼吸)

    // idle | toPlayer(自分へ向かっている・入力を受ける) |
    // toOpponent(相手へ向かっている・入力は無視) | resolved(ミス確定)
    let phase = "idle";
    let duration = START_DURATION;
    let launchAt = 0;
    let rally = 0;
    let autoMissTimer = null;

    function el(){
      return { ball: $("ball"), zone: $("zone"), player: $("playerWrap"),
        opponent: $("opponentWrap"), flash: $("flash") };
    }

    function flash(kind){
      const f = el().flash;
      f.className = "flash " + kind;
      // 同じクラスを続けて付けてもアニメが再生されるように、一度リフローを挟む
      void f.offsetWidth;
      f.classList.add("show");
    }

    function bounce(wrap){
      wrap.classList.remove("hit");
      void wrap.offsetWidth;
      wrap.classList.add("hit");
      setTimeout(function(){ wrap.classList.remove("hit"); }, 160);
    }

    // toPlayer: 相手→自分。ここだけタイミング入力を受け付ける
    function launchToPlayer(){
      phase = "toPlayer";
      launchAt = performance.now();
      const b = el().ball;
      b.classList.remove("hidden");
      b.style.transition = "none";
      b.style.top = OPPONENT_Y;
      void b.offsetWidth; // 強制リフローしてから transition を効かせる
      b.style.transition = "top " + duration + "ms linear";
      b.style.top = PLAYER_Y;
      el().zone.classList.add("armed");

      clearTimeout(autoMissTimer);
      autoMissTimer = setTimeout(function(){
        if (phase === "toPlayer") miss();
      }, duration + GRACE_MS);
    }

    // toOpponent: 自分の返球成功後、自分→相手。入力は無視し、相手は必ず打ち返す
    function launchToOpponent(){
      phase = "toOpponent";
      const b = el().ball;
      b.style.transition = "none";
      b.style.top = PLAYER_Y;
      void b.offsetWidth;
      b.style.transition = "top " + duration + "ms linear";
      b.style.top = OPPONENT_Y;

      setTimeout(function(){
        bounce(el().opponent);
        setTimeout(launchToPlayer, RETURN_PAUSE);
      }, duration);
    }

    function hit(){
      clearTimeout(autoMissTimer);
      rally += 1;
      $("rallyVal").textContent = String(rally);
      flash("good");
      el().player.classList.remove("miss");
      bounce(el().player);
      el().zone.classList.remove("armed");

      duration = Math.max(MIN_DURATION, duration - DURATION_STEP);
      launchToOpponent();
    }

    function miss(){
      phase = "resolved";
      clearTimeout(autoMissTimer);
      flash("bad");
      el().player.classList.add("miss");
      el().zone.classList.remove("armed");
      setTimeout(finish, 500);
    }

    function onAction(){
      if (phase !== "toPlayer") return;
      const elapsed = performance.now() - launchAt;
      const early = duration - WINDOW_MS;
      const late = duration + GRACE_MS;
      if (elapsed >= early && elapsed <= late) hit();
      else miss();
    }

    function finish(){
      const best = Math.max(rally, loadBest());
      saveBest(best);
      $("resultRally").textContent = String(rally);
      $("resultBest").textContent = String(best);
      $("bestVal").textContent = String(best);
      $("rankVal").textContent = String(rally);
      show("result");
    }

    function begin(){
      rally = 0;
      duration = START_DURATION;
      phase = "idle";
      $("rallyVal").textContent = "0";
      $("bestVal").textContent = String(loadBest());
      $("playerImg").src = charFile(selectedChar);
      $("opponentImg").src = opponentFile(selectedChar);
      el().player.classList.remove("hit","miss");
      el().opponent.classList.remove("hit");
      el().zone.classList.remove("armed");
      el().ball.classList.remove("hidden");
      show("play");
      setTimeout(launchToPlayer, 400);
    }

    // Playwright など外部からタイミングを検証できるように、最小限の状態だけ公開する
    // (RingGame/EchoGame の debugState() と同じ考え方)
    function debugState(){
      return { phase: phase, duration: duration, launchAt: launchAt,
        windowMs: WINDOW_MS, graceMs: GRACE_MS, rally: rally };
    }

    return { begin: begin, onAction: onAction, debugState: debugState };
  })();

  /* =========================================================
     4. 入力(タップ/クリック/スペースキーを1つの操作に統一)
     ========================================================= */
  $("court").addEventListener("pointerdown", function(e){
    e.preventDefault();
    TennisGame.onAction();
  });
  window.addEventListener("keydown", function(e){
    if (e.code === "Space" && $("play").classList.contains("active")) {
      e.preventDefault();
      TennisGame.onAction();
    }
  });

  /* =========================================================
     5. 画面の行き来
     ========================================================= */
  $("startBtn").addEventListener("click", function(){ TennisGame.begin(); });
  $("retryBtn").addEventListener("click", function(){ TennisGame.begin(); });
  $("titleBtn").addEventListener("click", function(){ show("title"); });

  paintCharRow();
  $("bestVal").textContent = String(loadBest());
  show("title");

  window.__tennis = TennisGame; // Playwright検証用
})();
</script>
</body>
</html>
