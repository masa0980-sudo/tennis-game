    };
    // 目は「カエルだけ頭の上」なので、その分だけ顔を描き分ける
    function face(c){
      if (c.ear === "frog") {
        return '<path d="M46 72 Q60 84 74 72" fill="none" stroke="{line}" stroke-width="3" stroke-linecap="round"/>';
      }
      return '<circle cx="45" cy="64" r="7" fill="#1f2937"/><circle cx="75" cy="64" r="7" fill="#1f2937"/>' +
        '<circle cx="42.5" cy="61" r="2.4" fill="#fff"/><circle cx="72.5" cy="61" r="2.4" fill="#fff"/>' +
        '<path d="M53 78 Q60 85 67 78" fill="none" stroke="{line}" stroke-width="3" stroke-linecap="round"/>';
    }
    function svg(charId){
      const c = findChar(charId);
      const tpl =
        '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          (EARS[c.ear] || "") +
          // もち体
          '<path d="M60 30 C88 30 104 50 104 74 C104 98 86 108 60 108 C34 108 16 98 16 74 C16 50 32 30 60 30 Z" ' +
            'fill="{body}" stroke="{line}" stroke-width="3.5"/>' +
          // ヘアバンド
          '<path d="M23 51 C35 37 85 37 97 51" fill="none" stroke="{accent}" stroke-width="11" stroke-linecap="round"/>' +
          '<path d="M23 51 C35 37 85 37 97 51" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>' +
          // ほお紅
          '<ellipse cx="30" cy="76" rx="8" ry="5.5" fill="{blush}" opacity=".85"/>' +
          '<ellipse cx="90" cy="76" rx="8" ry="5.5" fill="{blush}" opacity=".85"/>' +
          face(c) +
          // 襟(差し色)
          '<path d="M28 94 Q60 106 92 94" fill="none" stroke="{accent}" stroke-width="9" stroke-linecap="round"/>' +
          '<path d="M28 94 Q60 106 92 94" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>' +
        '</svg>';
      return tpl.replace(/\{body\}/g, c.body).replace(/\{accent\}/g, c.accent)
        .replace(/\{line\}/g, "#8a7358").replace(/\{blush\}/g, "#f7b6bd");
    }
    return { svg };
  })();

  const CHAR_KEY = "tennis-game:character";
  let selectedChar = localStorage.getItem(CHAR_KEY) || CHARACTERS[0].id;
  if (!CHARACTERS.some(function(c){ return c.id === selectedChar; })) selectedChar = CHARACTERS[0].id;

  /** キャラの見た目(画像 or SVG)を要素に流し込む。ラケットは画像に描かれているので
      SVGのキャラだけ、スイング時に別途ラケットを重ねる */
  function renderCharInto(el, charId, pose){
    const f = poseFile(charId, pose);
    if (f) {
      el.innerHTML = '<img src="' + f + '" alt="">';
      el.dataset.art = "img";
    } else {
      el.innerHTML = MochiArt.svg(charId) + RACKET_SVG;
      el.dataset.art = "svg";
    }
  }
  const RACKET_SVG =
    '<div class="svgRacket"><svg viewBox="0 0 30 52" aria-hidden="true">' +
      '<ellipse cx="15" cy="16" rx="12" ry="15" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>' +
      '<path d="M6 16H24M15 3V29M9 8L21 24M21 8L9 24" stroke="#e5e7eb" stroke-width=".8" opacity=".6"/>' +
      '<rect x="12" y="30" width="6" height="20" rx="3" fill="#b5773a"/>' +
    '</svg></div>';

  function paintCharRow(){
    const box = $("charRow");
    box.innerHTML = "";
    CHARACTERS.forEach(function(c){
      const btn = document.createElement("button");
      btn.className = "charBtn" + (c.id === selectedChar ? " selected" : "");
      btn.dataset.char = c.id;
      const art = document.createElement("span");
      art.className = "charArt";
      renderCharInto(art, c.id, "idle");
      const nm = document.createElement("span");
      nm.className = "cname"; nm.textContent = c.name;
      btn.appendChild(art); btn.appendChild(nm);
      btn.addEventListener("click", function(){
        selectedChar = c.id;
        localStorage.setItem(CHAR_KEY, selectedChar);
        paintCharRow();
      });
      box.appendChild(btn);
    });
  }
  function findChar(id){
    return CHARACTERS.find(function(x){ return x.id === id; }) || CHARACTERS[0];
  }
  /** 相手のキャラ。指定があればそれ、無ければプレイヤーと違うキャラを順に選ぶ */
  function opponentChar(preferId, playerId){
    if (preferId && preferId !== playerId) return findChar(preferId);
    const other = CHARACTERS.find(function(x){ return x.id !== playerId; });
    return other || CHARACTERS[1];
  }
  /** 見た目の更新。pose: "idle"|"run"|"swing"、facing: "left"|"right"。
      変化した時だけDOMを触る(毎フレーム代入しない) */
  function applyVisual(vis, wrap, charId, pose, facing){
    if (vis.pose !== pose || vis.char !== charId) {
      vis.pose = pose; vis.char = charId;
      wrap.dataset.pose = pose;
      renderCharInto(wrap.querySelector(".body"), charId, pose);
    }
    const flip = facing === "right" ? "-1" : "1";
    if (vis.flip !== flip) {
      vis.flip = flip;
      wrap.querySelector(".body").style.setProperty("--flip", flip);
    }
  }

  /* =========================================================
     5. ShotSystem — タイミング判定とコース(DOM非依存)
        delta = タップ時刻 - 到達時刻(負=早い)。ティアが次の球速・配置誤差・ゲージを決め、
        スワイプ方向(course)が狙う場所を決める。
     ========================================================= */
  const ShotSystem = (function(){
    const PERFECT_MS = 55, GOOD_MS = 130, EARLY_MS = 240, LATE_MS = 150;
    const SWING_COOLDOWN_MS = 420; // 空振り後の再スイング禁止(ok窓幅390msより広い=連打は罰せられる)
    const TIERS = {
      perfect: { mul:0.85, err:2,  gauge:34 },
      good:    { mul:0.95, err:6,  gauge:12 },
      ok:      { mul:1.08, err:14, gauge:0  },   // ふわっとした返球(相手に時間を与える)
    };
    const COURSES = {
      left:     { target:12,   mul:1.0, arc:42 },
      right:    { target:88,   mul:1.0, arc:42 },
      straight: { target:50,   mul:1.0, arc:42 },
      lob:      { target:null, mul:1.5, arc:110 }, // 相手の逆サイドへ、遅く高く
    };
    function judge(delta){
      const a = Math.abs(delta);
      if (a <= PERFECT_MS) return "perfect";
      if (a <= GOOD_MS) return "good";
      if (delta >= -EARLY_MS && delta <= LATE_MS) return "ok";
      return "whiff";
    }
    function courseTarget(course, opponentX){
      if (course === "lob") return opponentX < 50 ? 80 : 20;
      return (COURSES[course] || COURSES.straight).target;
    }
    // ctx: { rallyBase, minDuration, opponentX, smash }
    // スマッシュ(必殺): 速く低く、誤差半分。相手側の届く範囲は Opponents 側で狭める
    function resolve(tier, course, ctx){
      const T = TIERS[tier] || TIERS.ok;
      const C = COURSES[course] || COURSES.straight;
      const smash = !!ctx.smash;
      const err = smash ? T.err / 2 : T.err;
      const base = courseTarget(course, ctx.opponentX);
      const targetX = clamp(base + (rand() - 0.5) * 2 * err, 4, 96);
      const duration = clamp(ctx.rallyBase * T.mul * C.mul * (smash ? 0.62 : 1), ctx.minDuration * 0.55, 1800);
      return { tier: tier, course: course, smash: smash, targetX: targetX, duration: duration,
        arc: smash ? 18 : C.arc, errorUnits: err, gaugeGain: T.gauge };
    }
    return { judge, resolve, courseTarget, PERFECT_MS, GOOD_MS, EARLY_MS, LATE_MS, SWING_COOLDOWN_MS };
  })();

  /* =========================================================
     6. AutoMover — プレイヤーの自動移動
        ボールが自分に向かう間は着地点へ走り、相手に向かう間はセンターへ戻る(リカバリー)。
        到達失敗は「前の球で振られて戻り切る前に逆サイドへ速い球」のときだけ起きる。
     ========================================================= */
  const AutoMover = {
    SPEED: 0.080,          // 論理単位/ms(相手AIの最速0.078よりわずかに上)
    REACTION_MS: 80,       // 打球後、走り出すまで(走る絵を見せるため)
    STANCE_OFFSET: 4,      // ボールの少し左に止まる(体の横で打つ見た目)
    RECOVER_SPEED: 0.045,  // センターへ戻る速度
    // targetX へ speed で近づく。動いた方向("left"/"right")か、動かなければ null
    step: function(who, targetX, speed, dt){
      const dx = targetX - who.x;
      if (Math.abs(dx) < 0.01) return null;
      const s = speed * dt;
      if (Math.abs(dx) <= s) who.x = targetX;
      else who.x += Math.sign(dx) * s;
      who.x = clamp(who.x, who.min, who.max);
      return dx < 0 ? "left" : "right";
    },
  };

  /* =========================================================
     7. Opponents — 相手の定義(データ駆動)。トーナメントはこの順に勝ち抜く。
        speed: 論理単位/ms、reactionMs: 動き出す遅延、reach: 届く範囲、
        errorRate: 返球がアウトになる確率、smartChance: プレイヤーから遠い側を狙う確率、
        durationMul: 返球の速さ(小さいほど速い)、smashReachMul: プレイヤーのスマッシュに
        対する届く範囲の倍率、lobWeak: ネット際に出た時ロブに弱い、
        tellMs: 強打前の予備動作の長さ、smashEvery: n本に1本スマッシュを打つ
     ========================================================= */
  const OPPONENTS = [
    { id:"rookie", name:"ルーキー", char:"piyopiyo", desc:"ミスが多い。まずは相手のアウトを待とう", style:"erratic",
      speed:0.052, reactionMs:220, reach:15, errorRate:0.18, smartChance:0.10,
      startDuration:1300, minDuration:920, durationMul:1.05, smashReachMul:0.55, lobWeak:false, tellMs:0 },
    { id:"retriever", name:"ねばりの守護神", char:"mokomoko", desc:"遅いがなんでも拾う。角を狙って走らせろ", style:"steady",
      speed:0.076, reactionMs:120, reach:17, errorRate:0.04, smartChance:0.20,
      startDuration:1200, minDuration:840, durationMul:1.10, smashReachMul:0.35, lobWeak:false, tellMs:0 },
    { id:"rusher", name:"ネットラッシャー", char:"pyonpyon", desc:"ネットに詰めてくる。頭上をロブ(▲)で抜け", style:"netrush",
      speed:0.070, reactionMs:90, reach:20, errorRate:0.08, smartChance:0.45,
      startDuration:1100, minDuration:780, durationMul:0.88, smashReachMul:0.45, lobWeak:true, tellMs:0 },
    { id:"power", name:"パワーヒッター", char:"nosonoso", desc:"赤く光ったら強打が来る。落ち着いて合わせろ", style:"power",
      speed:0.064, reactionMs:140, reach:16, errorRate:0.12, smartChance:0.50,
      startDuration:1050, minDuration:730, durationMul:0.80, smashReachMul:0.50, lobWeak:false, tellMs:180 },
    { id:"champion", name:"チャンピオン", char:"patapata", desc:"死角なし。4本に1本スマッシュを打ってくる", style:"allround",
      speed:0.078, reactionMs:100, reach:17, errorRate:0.05, smartChance:0.60,
      startDuration:1000, minDuration:680, durationMul:0.85, smashReachMul:0.30, lobWeak:false, tellMs:150, smashEvery:4 },
  ];
  function findOpponent(id){ return OPPONENTS.find(function(o){ return o.id === id; }) || OPPONENTS[0]; }

  /* ラリーアタック用の「ラリーマシン」。必ず返す(reach 100・アウト無し)代わりに、
     続けるほど球が速く・狙いが厳しくなる(難易度ランプは rampFor で計算する)。 */
  const RALLY_MACHINE = {
    id:"machine", name:"ラリーマシン", char:"petapeta", desc:"ミスするまで続く", style:"machine",
    speed:0.30, reactionMs:60, reach:100, errorRate:0, smartChance:0.10,
    startDuration:1100, minDuration:520, durationMul:1.0, smashReachMul:1.0, lobWeak:false, tellMs:0,
  };
  /** ラリーアタックの難易度ランプ。hits(累計ヒット数)で球速と狙いの厳しさが上がる */
  function rampFor(hits){
    return {
      duration: Math.max(520, 1100 - hits * 12),
      smartChance: Math.min(0.85, 0.10 + hits * 0.012),
      smash: hits > 0 && hits % 10 === 0,
    };
  }
  function canReach(receiverX, ballX, radius){
    return Math.abs(receiverX - ballX) <= radius;
  }
  /** 打った瞬間の接触位置のズレから狙いを決める(相手AI用)。
      ボールの左で打てば右へ、右で打てば左へ、正面なら中央へ。 */
  function aimFromContact(receiverX, ballX){
    const offset = receiverX - ballX;
    return clamp(50 - offset * 2.6, 6, 94);
  }
  /** かしこい返球: プレイヤーから一番遠いコート端を狙う。 */
  function aimAwayFromPlayer(playerX){
    return playerX < 50 ? 90 : 10;
  }

  /* =========================================================
     8. Fx — 演出(ロジック非依存)
     ========================================================= */
  const Fx = (function(){
    const LABEL = { perfect:"PERFECT!", good:"GOOD", early:"EARLY", late:"LATE", whiff:"空振り",
      out:"OUT!", smash:"SMASH!", pass:"抜いた!", smashwin:"決まった!" };
    const CLS = { early:"ok", late:"ok", pass:"good", smashwin:"smash" };
    // where: "bottom"(自分側) | "top"(相手側)
    function judgePop(kind, cssX, where){
      const court = $("court");
      const el = document.createElement("div");
      el.className = "judgePop " + (CLS[kind] || kind);
      el.textContent = LABEL[kind] || kind;
      el.style.left = cssX + "%";
      if (where === "top") el.style.top = "18%"; else el.style.bottom = "26%";
      court.appendChild(el);
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 700);
    }
    function shake(){
      const c = $("court");
      c.classList.remove("shake");
      void c.offsetWidth;
      c.classList.add("shake");
      setTimeout(function(){ c.classList.remove("shake"); }, 300);
    }
    // 粒はプールから使い回す(毎回DOMを作ると打つたびにGCが走る)
    const pool = [];
    const COLORS = { perfect:"#fff7c2", good:"#7dd3fc", ok:"#fde68a", smash:"#fda4af" };
    function burst(cssX, cssY, kind, n){
      const court = $("court");
      const color = COLORS[kind] || "#fff";
      n = n || (kind === "perfect" || kind === "smash" ? 10 : 6);
      for (let i = 0; i < n; i++) {
        const el = pool.pop() || document.createElement("div");
        el.className = "spark";
        el.style.background = color;
        el.style.left = cssX + "%";
        el.style.bottom = cssY + "%";
        const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
        const dist = 26 + Math.random() * 26;
        el.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
        el.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "px");
        court.appendChild(el);
        void el.offsetWidth;
        el.classList.add("fly");
        setTimeout(function(){
          if (el.parentNode) el.parentNode.removeChild(el);
          el.className = "spark";
          if (pool.length < 40) pool.push(el);
        }, 460);
      }
    }
    function litDir(dir){
      const el = document.querySelector('.hintDir[data-dir="' + dir + '"]');
      if (!el) return;
      el.classList.remove("lit");
      void el.offsetWidth;
      el.classList.add("lit");
      setTimeout(function(){ el.classList.remove("lit"); }, 320);
    }
    function flash(kind){
      const f = $("flash");
      f.className = "flash " + kind;
      void f.offsetWidth;
      f.classList.add("show");
    }
    function bounce(wrap, kind){
      wrap.classList.remove("hit","miss","whiff");
      void wrap.offsetWidth;
      wrap.classList.add(kind);
      setTimeout(function(){ wrap.classList.remove(kind); }, 180);
    }
    return { judgePop, litDir, flash, bounce, shake, burst };
  })();

  /* =========================================================
     9. TennisGame — ラリーの進行(状態機械)と描画
        phase: "serve" | "ballToPlayer" | "hitstop" | "ballToOpponent" | "returning" | "pointOver" | "gameOver"
        連続系(自動移動・描画)は毎フレーム、離散系(ラリーの進行)はタイマーで進める。
     ========================================================= */
  const TennisGame = (function(){
    const REACH_RADIUS = 17;      // 自分の届く範囲(論理単位)
    const DURATION_STEP = 40;     // ラリーが続くほど速くなる
    const RETURN_PAUSE = 220;     // 相手が打ち返すまでの間(テル表示用に少し長め)
    const HITSTOP_MS = 90;        // 打った瞬間ボールが止まる(演出 + スワイプ読み取りの猶予)
    const SWIPE_WINDOW_MS = 160;  // スイング後、コースを受け付ける時間

    let phase = "serve";
    let opp = OPPONENTS[0];
    let oppCharId = CHARACTERS[1].id;   // 相手のキャラ(OPPONENTS の char。自分と被ったら別のキャラ)
    let exchanges = 0;            // このポイントで自分が返した回数(球速の基準)
    let meta = { mode:"free", stage:null };
    let onEnd = null;             // モード側のコールバック(結果画面のボタンを描く)
    let gauge = 0;                // 必殺ゲージ 0〜100(ポイント間で持ち越し、失点で-20)
    let opponentHits = 0;         // 相手が返した回数(チャンピオンのスマッシュ周期用)
    let tell = null;              // 相手の予備動作 { dir:"L"|"R", charge:bool }
    let atNet = false;            // ネットラッシャーが前に出ているか
    const stats = { deuceSeen:false, playerMisses:0, smashPoints:0, lobPoints:0, outs:0 };
    // ラリーアタック用。hits=累計ヒット数、combo=連続perfect/good(okで途切れる)
    const rallyRun = { hits:0, score:0, combo:0, maxCombo:0 };
    function isRally(){ return meta.mode === "rally"; }
    const OPPONENT_TOP_NET = 22;  // ネット際に出た時の相手の位置(top %)
    const OPPONENT_Y_NET = 27;    // その時のボールの打点(%)

    const SWING_MS = 240;         // スイングポーズを見せる時間
    const player = { x: 50, targetX: 50, min: Court.X_MIN, max: Court.X_MAX, running: null, facing: "left", cooldownUntil: 0 };
    const opponent = { x: 50, min: Court.X_MIN, max: Court.X_MAX, running: null, facing: "left" };
    const vis = { player: { pose:null, flip:null, char:null }, opponent: { pose:null, flip:null, char:null } };
    let playerSwingUntil = 0, opponentSwingUntil = 0;
    const ball = { x:50, y:Court.OPPONENT_Y, fromX:50, fromY:Court.OPPONENT_Y,
      targetX:50, targetY:Court.PLAYER_Y, flightStart:0, flightDuration:1200, arc:42 };

    let rafId = null, lastTick = 0;
    let autoMissTimer = null, arriveTimer = null, hitstopTimer = null;
    let opponentReactAt = 0;

    const score = { player:0, opponent:0 };
    let lastLabels = scoreLabels(0, 0);
    let lastSmartReturn = false;
    let lastShot = null;          // 直近の自分のショット { tier, deltaMs, course, targetX, duration, arc }
    let pendingShot = null;       // ヒットストップ中の暫定ショット
    let forcedCourse = null;      // テスト用: 次のスイングのコースを固定
    let hitstopUntil = 0, courseWindowUntil = 0, swingAt = 0;
    const rally = { count:0, longest:0, perfects:0 };

    function el(){
      return { ball: $("ball"), shadow: $("ballShadow"), hitZone: $("hitZone"),
        player: $("playerWrap"), opponent: $("opponentWrap") };
    }
    /** 「今タップしたら実際にヒットする」か。swing() の成功条件と同じ式にして、
        見た目(バー/ボールの光り)と成否が食い違わないようにする */
    function isHittableNow(now){
      if (phase !== "ballToPlayer" || now < player.cooldownUntil) return false;
      if (!canReach(player.x, ball.x, REACH_RADIUS)) return false;
      return ShotSystem.judge(now - (ball.flightStart + ball.flightDuration)) !== "whiff";
    }
    function updateVisuals(now){
      const e = el();
      applyVisual(vis.player, e.player, selectedChar,
        now < playerSwingUntil ? "swing" : (player.running ? "run" : "idle"), player.facing);
      applyVisual(vis.opponent, e.opponent, oppCharId,
        now < opponentSwingUntil ? "swing" : (opponent.running ? "run" : "idle"), opponent.facing);
    }
    function rallyBase(){
      if (isRally()) return rampFor(rallyRun.hits).duration;
      return Math.max(opp.minDuration, opp.startDuration - exchanges * DURATION_STEP);
    }
    function clearTimers(){
      clearTimeout(autoMissTimer); clearTimeout(arriveTimer); clearTimeout(hitstopTimer);
    }
    function paintRally(){ $("rallyCount").textContent = String(rally.count); }
    /** ラリーアタック中のHUD: 得点(左)とコンボ(右)をテニスの点数の代わりに出す */
    function paintRallyScore(){
      $("playerScore").textContent = String(rallyRun.score);
      $("opponentScore").textContent = String(rallyRun.combo);
    }
    function paintGauge(){
      $("gaugeFill").style.width = gauge + "%";
      $("gauge").classList.toggle("full", gauge >= 100);
      $("gaugeLabel").textContent = gauge >= 100 ? "SMASH READY" : "SMASH";
    }
    function opponentY(){ return atNet ? OPPONENT_Y_NET : Court.OPPONENT_Y; }
    function setNet(on){
      atNet = on;
      $("opponentWrap").style.top = on ? (OPPONENT_TOP_NET + "%") : "0.5%";
    }
    function applyTell(t){
      tell = t;
      const w = $("opponentWrap");
      w.dataset.tell = t ? (t.dir + (t.charge ? "!" : "")) : "";
      w.querySelector(".body").style.setProperty("--lean", t ? (t.dir === "L" ? "-12deg" : "12deg") : "0deg");
      w.classList.toggle("charge", !!(t && t.charge));
      if (t && t.charge) Sfx.charge();
    }

    /* ---- 描画 ---- */
    function renderCourt(now){
      const e = el();
      e.player.style.left = Court.toCssX(player.x) + "%";
      e.opponent.style.left = Court.toCssX(opponent.x) + "%";
      e.hitZone.style.left = Court.toCssX(player.x) + "%";
      const ready = isHittableNow(now);
      e.hitZone.classList.toggle("visible", phase === "ballToPlayer");
      e.hitZone.classList.toggle("ready", ready);
      e.ball.classList.toggle("ready", ready);

      if (phase === "ballToPlayer" || phase === "ballToOpponent" || phase === "hitstop" || phase === "ballOut") {
        if (phase !== "hitstop") {
          const t = clamp((now - ball.flightStart) / ball.flightDuration, 0, 1);
          ball.x = lerp(ball.fromX, ball.targetX, t);
          ball.y = lerp(ball.fromY, ball.targetY, t);
        }
        const t2 = clamp((now - ball.flightStart) / ball.flightDuration, 0, 1);
        const hover = (phase === "hitstop") ? 0 : ball.arc * 4 * t2 * (1 - t2);
        const scale = 1 + hover / 140;
        e.ball.style.left = Court.toCssX(ball.x) + "%";
        e.ball.style.top = ball.y + "%";
        e.ball.style.transform = "translateY(-" + hover.toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";
        e.shadow.style.left = Court.toCssX(ball.x) + "%";
        e.shadow.style.top = ball.y + "%";
        e.shadow.style.opacity = String(clamp(1 - hover / ball.arc, .15, 1));
        e.shadow.style.transform = "scale(" + clamp(1 - hover / (ball.arc * 1.6), .4, 1).toFixed(2) + ")";
      }
    }

    /* ---- 自動移動(自分) ---- */
    function updatePlayerAuto(now, dt){
      let dir = null;
      if (phase === "ballToPlayer") {
        if (now >= ball.flightStart + AutoMover.REACTION_MS) {
          dir = AutoMover.step(player, player.targetX, AutoMover.SPEED, dt);
        }
      } else if (phase === "ballToOpponent" || phase === "returning" || phase === "ballOut") {
        player.targetX = 50;
        dir = AutoMover.step(player, 50, AutoMover.RECOVER_SPEED, dt);
      }
      player.running = dir;
      if (dir) player.facing = dir;
    }

    /* ---- 相手AI(ballToOpponent の間だけ、着地点へ向けて動く) ---- */
    function updateOpponent(now, dt){
      let dir = null;
      if (phase === "ballToOpponent" && now >= opponentReactAt) {
        // ネット際にいる時のロブは頭上を越えていくので、後ろへはほとんど下がれない
        const lobbed = atNet && opp.lobWeak && lastShot && lastShot.course === "lob";
        dir = AutoMover.step(opponent, ball.targetX, opp.speed * (lobbed ? 0.12 : 1), dt);
      }
      opponent.running = dir;
      if (dir) opponent.facing = dir;
    }

    /* ---- ラリーの進行 ---- */
    function launchToPlayer(targetX, duration, arc, opts){
      phase = "ballToPlayer";
      ball.fromX = opponent.x; ball.fromY = opponentY();
      ball.targetX = clamp(targetX, 4, 96);
      ball.targetY = Court.PLAYER_Y;
      ball.flightStart = performance.now();
      ball.flightDuration = duration;
      ball.arc = arc || 42;
      ball.smash = !!(opts && opts.smash);
      if (ball.smash) { Fx.judgePop("smash", Court.toCssX(opponent.x), "top"); Sfx.smash(); }
      player.targetX = clamp(ball.targetX - AutoMover.STANCE_OFFSET, player.min, player.max);
      $("ball").classList.remove("hidden");
      clearTimeout(autoMissTimer);
      autoMissTimer = setTimeout(function(){
        if (phase === "ballToPlayer") miss("late");
      }, duration + ShotSystem.LATE_MS);
    }

    function serve(){
      exchanges = 0;
      rally.count = 0; paintRally();
      const targetX = 50 + (rand() - 0.5) * 30;
      launchToPlayer(targetX, opp.startDuration, 42);
    }

    function launchToOpponent(shot){
      phase = "ballToOpponent";
      ball.fromX = ball.x; ball.fromY = Court.PLAYER_Y;
      ball.targetX = shot.targetX;
      ball.targetY = opponentY();
      ball.flightStart = performance.now();
      ball.flightDuration = shot.duration;
      ball.arc = shot.arc;
      ball.smash = !!shot.smash;
      opponentReactAt = ball.flightStart + opp.reactionMs + (shot.smash ? 90 : 0);
      clearTimeout(arriveTimer);
      arriveTimer = setTimeout(opponentArrives, shot.duration);
    }

    /* 相手にボールが届いた瞬間。個性(OPPONENTS の値)はすべてここで効く */
    function opponentArrives(){
      if (phase !== "ballToOpponent") return;
      const shot = lastShot || {};
      let reach = opp.reach;
      if (shot.smash) reach *= opp.smashReachMul;                    // 必殺スマッシュは届きにくい
      if (shot.course === "lob" && opp.lobWeak && atNet) reach *= 0.25; // ネット際の相手はロブに弱い
      if (!canReach(opponent.x, ball.targetX, reach)) {
        if (shot.smash) stats.smashPoints += 1;
        if (shot.course === "lob") stats.lobPoints += 1;
        Fx.judgePop(shot.smash ? "smashwin" : "pass", Court.toCssX(ball.targetX), "top");
        pointFor("player");
        return;
      }
      Fx.bounce(el().opponent, "hit");
      Fx.burst(Court.toCssX(opponent.x), 100 - opponentY(), "good", 5);
      opponentSwingUntil = performance.now() + SWING_MS;
      opponentHits += 1;
      Sfx.bounce();
      phase = "returning"; // 相手が構えている間は入力を受け付けない
      ball.x = ball.targetX; ball.y = opponentY();

      // 相手のミス(アウト): 個性が「見て分かる」失点
      if (rand() < opp.errorRate) {
        stats.outs += 1;
        const outX = opponent.x < 50 ? 106 : -6;
        const dur = Math.max(opp.minDuration * 0.7, rallyBase() * opp.durationMul);
        arriveTimer = setTimeout(function(){ launchOut(outX, dur); }, RETURN_PAUSE);
        return;
      }

      const ramp = isRally() ? rampFor(rallyRun.hits) : null;
      lastSmartReturn = rand() < (ramp ? ramp.smartChance : opp.smartChance);
      let targetX = lastSmartReturn ? aimAwayFromPlayer(player.x) : aimFromContact(opponent.x, ball.targetX);
      if (opp.style === "power") targetX = lerp(targetX, targetX < 50 ? 8 : 92, 0.6); // 角へさらに寄せる
      const isSmash = ramp ? ramp.smash : (!!opp.smashEvery && (opponentHits % opp.smashEvery === 0));
      const duration = Math.max(opp.minDuration * 0.7, rallyBase() * opp.durationMul) * (isSmash ? 0.65 : 1);
      if (opp.style === "netrush" && !atNet && rand() < 0.6) setNet(true); // 返球後に前へ出る

      const charge = isSmash || (opp.style === "power" && opp.tellMs > 0 && rand() < 0.5);
      applyTell({ dir: targetX < 50 ? "L" : "R", charge: charge });
      const pause = RETURN_PAUSE + (charge ? opp.tellMs : 0);
      arriveTimer = setTimeout(function(){
        applyTell(null);
        launchToPlayer(targetX, charge ? duration * 0.85 : duration, isSmash ? 18 : 42, { smash: isSmash });
      }, pause);
    }

    /* 相手のアウト: サイドラインの外へ飛んでいき、着地でプレイヤーの得点 */
    function launchOut(targetX, duration){
      phase = "ballOut";
      ball.fromX = opponent.x; ball.fromY = opponentY();
      ball.targetX = targetX; ball.targetY = Court.PLAYER_Y;
      ball.flightStart = performance.now(); ball.flightDuration = duration; ball.arc = 42; ball.smash = false;
      arriveTimer = setTimeout(function(){
        if (phase !== "ballOut") return;
        Fx.judgePop("out", Court.toCssX(clamp(targetX, 2, 98)));
        pointFor("player");
      }, duration);
    }

    /** タップ/スペース。ballToPlayer の間だけ意味を持つ。戻り値は判定ティア(or null) */
    function swing(now){
      if (phase !== "ballToPlayer") return null;
      now = (typeof now === "number") ? now : performance.now();
      if (now < player.cooldownUntil) return null;
      const arrivalAt = ball.flightStart + ball.flightDuration;
      const delta = now - arrivalAt;
      const inReach = canReach(player.x, ball.x, REACH_RADIUS);
      const tier = inReach ? ShotSystem.judge(delta) : "whiff";
      const cssX = Court.toCssX(player.x);

      playerSwingUntil = now + SWING_MS;
      if (tier === "whiff") {
        player.cooldownUntil = now + ShotSystem.SWING_COOLDOWN_MS;
        lastShot = { tier:"whiff", deltaMs: delta, course:null, targetX:null, duration:null, arc:null };
        Fx.bounce(el().player, "whiff");
        Fx.judgePop("whiff", cssX);
        Sfx.whiff();
        return "whiff";
      }

      // ヒット: ボールを止め(ヒットストップ)、コースは後追いで受け付ける
      clearTimeout(autoMissTimer);
      phase = "hitstop";
      swingAt = now;
      hitstopUntil = now + HITSTOP_MS;
      courseWindowUntil = now + SWIPE_WINDOW_MS;
      exchanges += 1;
      rally.count += 1; paintRally();
      if (rally.count > rally.longest) rally.longest = rally.count;
      if (tier === "perfect") rally.perfects += 1;
      if (isRally()) {
        rallyRun.hits += 1;
        // ok(EARLY/LATE)は得点するがコンボは途切れる
        if (tier === "ok") rallyRun.combo = 0;
        else { rallyRun.combo += 1; rallyRun.maxCombo = Math.max(rallyRun.maxCombo, rallyRun.combo); }
        rallyRun.score += rallyPoints(tier, rallyRun.combo);
        if (rallyRun.hits % 10 === 0) rallyRun.score += 500;   // 10本ごとのボーナス
        paintRallyScore();
      }
      const course = forcedCourse || "straight";
      forcedCourse = null;
      // ゲージ満タンなら perfect/good が自動でスマッシュになる(追加入力なし)
      const smash = gauge >= 100 && (tier === "perfect" || tier === "good");
      pendingShot = ShotSystem.resolve(tier, course, shotCtx(smash));
      if (smash) gauge = 0; else gauge = Math.min(100, gauge + pendingShot.gaugeGain);
      paintGauge();
      lastShot = { tier: tier, deltaMs: delta, course: course, smash: smash, targetX: pendingShot.targetX,
        duration: pendingShot.duration, arc: pendingShot.arc };
      Fx.flash("good");
      Fx.bounce(el().player, "hit");
      Fx.judgePop(smash ? "smash" : (tier === "ok" ? (delta < 0 ? "early" : "late") : tier), cssX);
      Fx.burst(cssX, 100 - Court.PLAYER_Y, smash ? "smash" : tier);
      if (smash) { Sfx.smash(); Fx.shake(); } else Sfx.hit(tier);
      hitstopTimer = setTimeout(fire, HITSTOP_MS);
      return tier;
    }
    function shotCtx(smash){
      return { rallyBase: rallyBase(), minDuration: opp.minDuration, opponentX: opponent.x, smash: !!smash };
    }
    /** ロブは必殺スマッシュにしない(高く遅い球なので)。その場合ゲージは返す */
    function keepSmash(smash, course){
      if (smash && course === "lob") { gauge = 100; paintGauge(); return false; }
      return smash;
    }
    function fire(){
      if (phase !== "hitstop" || !pendingShot) return;
      const shot = pendingShot;
      pendingShot = null;
      launchToOpponent(shot);
    }

    /** スワイプ/矢印キーで決めたコース。スイング直後の窓(SWIPE_WINDOW_MS)内だけ効く */
    function applyCourse(course){
      if (!course) return false;
      const now = performance.now();
      if (now > courseWindowUntil) return false;
      if (phase === "hitstop" && pendingShot) {
        const smash = keepSmash(pendingShot.smash, course);
        pendingShot = ShotSystem.resolve(pendingShot.tier, course, shotCtx(smash));
        lastShot.course = course; lastShot.smash = smash; lastShot.targetX = pendingShot.targetX;
        lastShot.duration = pendingShot.duration; lastShot.arc = pendingShot.arc;
        Fx.litDir(course);
        return true;
      }
      if (phase === "ballToOpponent" && lastShot && lastShot.tier !== "whiff") {
        // 発射直後(飛行10%未満)なら飛行中の球の行き先を差し替える
        const smash = keepSmash(lastShot.smash, course);
        const shot = ShotSystem.resolve(lastShot.tier, course, shotCtx(smash));
        ball.targetX = shot.targetX; ball.flightDuration = shot.duration; ball.arc = shot.arc; ball.smash = smash;
        lastShot.course = course; lastShot.smash = smash; lastShot.targetX = shot.targetX;
        lastShot.duration = shot.duration; lastShot.arc = shot.arc;
        clearTimeout(arriveTimer);
        arriveTimer = setTimeout(opponentArrives, Math.max(0, ball.flightStart + shot.duration - now));
        Fx.litDir(course);
        return true;
      }
      return false;
    }

    function miss(reason){
      if (phase !== "ballToPlayer") return;
      phase = "pointOver";
      clearTimers();
      Fx.flash("bad");
      Fx.bounce(el().player, "miss");
      stats.playerMisses += 1;
      lastShot = { tier:"miss", deltaMs:null, course:null, targetX:null, duration:null, arc:null, reason: reason };
      if (isRally()) { Sfx.pointLose(); phase = "gameOver"; setTimeout(finish, 700); return; }
      pointFor("opponent");
    }

    function pointFor(who){
      phase = "pointOver";
      clearTimers();
      applyTell(null);
      setNet(false);
      score[who] += 1;
      lastLabels = scoreLabels(score.player, score.opponent);
      if (lastLabels.deuce) stats.deuceSeen = true;
      $("playerScore").textContent = lastLabels.forLabel;
      $("opponentScore").textContent = lastLabels.againstLabel;
      $("deuceNote").hidden = !lastLabels.deuce;
      if (who === "player") Sfx.pointWin(); else { Sfx.pointLose(); gauge = Math.max(0, gauge - 20); paintGauge(); }
      if (lastLabels.gameOver) {
        phase = "gameOver";
        setTimeout(finish, 600);
      } else {
        setTimeout(function(){ phase = "serve"; serve(); }, 700);
      }
    }

    function finish(){
      const win = lastLabels.winner === "for";
      $("result").dataset.mode = isRally() ? "rally" : "tournament";
      $("rankVal").textContent = win ? "WIN" : "LOSE";
      $("resultScore").textContent = String(rallyRun.score);
      $("resultSub").textContent = isRally()
        ? (rallyRun.hits + " 回続いた")
        : ("vs " + opp.name);
      $("resultPlayer").textContent = String(score.player);
      $("resultOpponent").textContent = String(score.opponent);
      $("resultRally").textContent = String(isRally() ? rallyRun.hits : rally.longest);
      $("resultPerfect").textContent = String(rally.perfects);
      $("resultCombo").textContent = String(rallyRun.maxCombo);
      $("resultBtns").innerHTML = "";
      if (isRally()) Sfx.lose(); else if (win) Sfx.win(); else Sfx.lose();
      show("result");
      stopLoop();
      Progress.applyEquipped();
      const result = { mode: meta.mode, win: win, opponentId: opp.id,
        pointsPlayer: score.player, pointsOpponent: score.opponent,
        longestRally: rally.longest, perfects: rally.perfects, deuceSeen: stats.deuceSeen,
        playerMisses: stats.playerMisses, smashPoints: stats.smashPoints, lobPoints: stats.lobPoints, outs: stats.outs,
        hits: rallyRun.hits, score: rallyRun.score, maxCombo: rallyRun.maxCombo };
      if (typeof onEnd === "function") onEnd(result);
      Progress.onResult(result);   // 実績判定は結果画面を出したあと(トーストが乗る)
    }

    function begin(opts){
      opts = opts || {};
      opp = opts.opponent || OPPONENTS[0];
      meta = opts.meta || { mode:"free", stage:null };
      onEnd = opts.onEnd || null;
      clearTimers();
      score.player = 0; score.opponent = 0;
      lastLabels = scoreLabels(0, 0);
      lastSmartReturn = false; lastShot = null; pendingShot = null; forcedCourse = null;
      exchanges = 0; opponentHits = 0; gauge = 0; paintGauge();
      stats.deuceSeen = false; stats.playerMisses = 0; stats.smashPoints = 0; stats.lobPoints = 0; stats.outs = 0;
      oppCharId = opponentChar(opp.char, selectedChar).id;
      rallyRun.hits = 0; rallyRun.score = 0; rallyRun.combo = 0; rallyRun.maxCombo = 0;
      // 前の試合の最後の球(アウトなら場外)が残ったままにならないよう、相手の足元に戻す
      ball.x = 50; ball.y = Court.OPPONENT_Y; ball.fromX = 50; ball.fromY = Court.OPPONENT_Y;
      ball.targetX = 50; ball.targetY = Court.PLAYER_Y; ball.arc = 42; ball.smash = false;
      ball.flightStart = 0; ball.flightDuration = opp.startDuration;
      applyTell(null); setNet(false);
      $("vsName").textContent = isRally() ? "ラリーアタック" : ("vs " + opp.name);
      $("playerLabel").textContent = isRally() ? "SCORE" : "あなた";
      $("opponentLabel").textContent = isRally() ? "COMBO" : "相手";
      rally.count = 0; rally.longest = 0; rally.perfects = 0; paintRally();
      player.x = 50; player.targetX = 50; player.cooldownUntil = 0; player.running = null; player.facing = "left";
      opponent.x = 50; opponent.running = null; opponent.facing = "left";
      playerSwingUntil = 0; opponentSwingUntil = 0;
      vis.player.pose = null; vis.player.flip = null; vis.player.char = null;
      vis.opponent.pose = null; vis.opponent.flip = null; vis.opponent.char = null;
      phase = "serve";
      if (isRally()) paintRallyScore();
      else {
        $("playerScore").textContent = lastLabels.forLabel;
        $("opponentScore").textContent = lastLabels.againstLabel;
      }
      $("deuceNote").hidden = true;
      const e = el();
      e.player.classList.remove("hit","miss","whiff");
      e.opponent.classList.remove("hit","miss","whiff");
      updateVisuals(performance.now());
      e.ball.style.left = Court.toCssX(ball.x) + "%";
      e.ball.style.top = ball.y + "%";
      e.ball.style.transform = "";
      e.shadow.style.left = Court.toCssX(ball.x) + "%";
      e.shadow.style.top = ball.y + "%";
      $("ball").classList.remove("hidden");
      show("play");
      Progress.applyEquipped();
      startLoop();
      setTimeout(function(){ if (phase === "serve") serve(); }, 600);
    }

    function loop(now){
      const dt = lastTick ? Math.min(50, now - lastTick) : 16;
      lastTick = now;
      updatePlayerAuto(now, dt);
      updateOpponent(now, dt);
      updateVisuals(now);
      renderCourt(now);
      rafId = requestAnimationFrame(loop);
    }
    function startLoop(){ stopLoop(); lastTick = 0; rafId = requestAnimationFrame(loop); }
    function stopLoop(){ if (rafId) cancelAnimationFrame(rafId); rafId = null; }

    function forceCourse(course){ forcedCourse = course || null; }

    // Playwrightなど外部から検証できるように、判定に必要な状態を公開する
    function debugState(){
      return {
        phase: phase,
        mode: meta.mode, stage: meta.stage,
        opponentId: opp.id,
        gauge: gauge,
        ball: { x: ball.x, y: ball.y, fromX: ball.fromX, fromY: ball.fromY,
          targetX: ball.targetX, targetY: ball.targetY,
          flightStart: ball.flightStart, flightDuration: ball.flightDuration,
          arrivalAt: ball.flightStart + ball.flightDuration, arc: ball.arc, smash: !!ball.smash },
        stats: { deuceSeen: stats.deuceSeen, playerMisses: stats.playerMisses, smashPoints: stats.smashPoints,
          lobPoints: stats.lobPoints, outs: stats.outs, opponentHits: opponentHits },
        rallyRun: { hits: rallyRun.hits, score: rallyRun.score, combo: rallyRun.combo, maxCombo: rallyRun.maxCombo },
        player: { x: player.x, targetX: player.targetX, min: player.min, max: player.max,
          running: player.running, facing: player.facing, cooldownUntil: player.cooldownUntil },
        visual: { playerPose: vis.player.pose, playerFlip: vis.player.flip, playerChar: vis.player.char,
          opponentPose: vis.opponent.pose, opponentFlip: vis.opponent.flip, opponentChar: vis.opponent.char,
          playerArt: $("playerWrap").querySelector(".body").dataset.art,
          ready: isHittableNow(performance.now()) },
        opponent: { id: opp.id, x: opponent.x, targetX: ball.targetX, smartReturn: lastSmartReturn,
          running: opponent.running, reach: opp.reach, tell: tell, atNet: atNet },
        lastShot: lastShot,
        pendingCourse: pendingShot ? pendingShot.course : null,
        hitstopUntil: hitstopUntil, courseWindowUntil: courseWindowUntil, swingAt: swingAt,
        exchanges: exchanges,
        rally: { count: rally.count, longest: rally.longest, perfects: rally.perfects },
        reachRadius: REACH_RADIUS,
        score: {
          pointsPlayer: score.player, pointsOpponent: score.opponent,
          playerLabel: lastLabels.forLabel, opponentLabel: lastLabels.againstLabel,
          deuce: !!lastLabels.deuce, advantage: lastLabels.advantage || null,
          gameOver: !!lastLabels.gameOver, winner: lastLabels.winner || null,
        },
        constants: { perfectMs: ShotSystem.PERFECT_MS, goodMs: ShotSystem.GOOD_MS,
          earlyMs: ShotSystem.EARLY_MS, lateMs: ShotSystem.LATE_MS,
          swipeWindowMs: SWIPE_WINDOW_MS, hitstopMs: HITSTOP_MS, cooldownMs: ShotSystem.SWING_COOLDOWN_MS,
          reachRadius: REACH_RADIUS },
      };
    }

    return { begin, swing, applyCourse, forceCourse, debugState };
  })();

  /* =========================================================
     10. Input — タップ即スイング、コースは後追い
        pointerdown の瞬間にスイング(タイミング判定)し、その後 SWIPE_MIN_PX 以上動いたら
        スワイプ方向をコースとして適用する。ヒットストップ中に読むので遅延として感じない。
        キーボードは Space/Enter/J でスイング、矢印キー(押しっぱなし優先)でコース。
     ========================================================= */
  const Input = (function(){
    const SWIPE_MIN_PX = 18;
    const SWIPE_WINDOW_MS = 160;
    const court = $("court");
    let gesture = null;
    let heldDir = null;

    function resolveCourse(dx, dy){
      if (Math.abs(dy) > Math.abs(dx) * 1.2 && dy < 0) return "lob";
      return dx < 0 ? "left" : "right";
    }
    function settle(g, course){
      if (g.resolved) return;
      g.resolved = true;
      TennisGame.applyCourse(course);
    }

    court.addEventListener("pointerdown", function(e){
      e.preventDefault();
      if (gesture) return;                      // 2本目の指は無視(二重発火防止)
      const g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, resolved: false };
      gesture = g;
      try { court.setPointerCapture(e.pointerId); } catch (err) {}
      TennisGame.swing(performance.now());
      if (heldDir) settle(g, heldDir);          // 矢印キーを押しながらタップ/スペース
      setTimeout(function(){ settle(g, "straight"); if (gesture === g) gesture = null; }, SWIPE_WINDOW_MS);
    });
    court.addEventListener("pointermove", function(e){
      const g = gesture;
      if (!g || g.resolved || e.pointerId !== g.id) return;
      const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
      if (Math.hypot(dx, dy) >= SWIPE_MIN_PX) settle(g, resolveCourse(dx, dy));
    });
    function end(e){
      const g = gesture;
      if (!g || e.pointerId !== g.id) return;
      settle(g, "straight");
      gesture = null;
    }
    court.addEventListener("pointerup", end);
    court.addEventListener("pointercancel", end);

    const DIR_KEYS = { ArrowLeft:"left", a:"left", A:"left", ArrowRight:"right", d:"right", D:"right",
      ArrowUp:"lob", w:"lob", W:"lob" };
    const SWING_CODES = { Space:1, Enter:1, KeyJ:1 };
    window.addEventListener("keydown", function(e){
      const dir = DIR_KEYS[e.key];
      if (dir) {
        heldDir = dir;
        if ($("play").classList.contains("active")) TennisGame.applyCourse(dir);
        e.preventDefault();
        return;
      }
      if (SWING_CODES[e.code] && $("play").classList.contains("active")) {
        e.preventDefault();
        if (e.repeat) return;
        TennisGame.swing(performance.now());
        if (heldDir) TennisGame.applyCourse(heldDir);
      }
    });
    window.addEventListener("keyup", function(e){
      if (DIR_KEYS[e.key] === heldDir) heldDir = null;
    });

    return { resolveCourse };
  })();

  /* =========================================================
     11. Modes — トーナメント(勝ち抜き)。進行は localStorage に保存する。
        TennisGame はモードを知らず、begin({opponent, meta, onEnd}) の onEnd で
        結果画面のボタンをモード側が描く。
     ========================================================= */
  const Modes = (function(){
    const T_KEY = "tennis-game:tournament";
    function loadT(){
      try {
        const r = JSON.parse(localStorage.getItem(T_KEY) || "null");
        if (r && r.v === 1) return r;
      } catch (e) {}
      return { v:1, bestStage:0, cleared:false, beaten:{}, lastStage:0 };
    }
    function saveT(t){ try { localStorage.setItem(T_KEY, JSON.stringify(t)); } catch (e) {} }
    function resetT(){ try { localStorage.removeItem(T_KEY); } catch (e) {} }
    function btn(cls, label, fn){
      const b = document.createElement("button");
      b.className = cls; b.textContent = label;
      b.addEventListener("click", fn);
      return b;
    }
    let current = null; // { mode, stage }

    const Tournament = {
      // force: テスト用。未到達の相手にも挑める
      start: function(stage, force){
        const t = loadT();
        const maxStage = force ? OPPONENTS.length - 1 : Math.min(t.bestStage, OPPONENTS.length - 1);
        stage = clamp(stage | 0, 0, maxStage);
        t.lastStage = stage; saveT(t);
        current = { mode:"tournament", stage: stage };
        Sfx.unlock();
        TennisGame.begin({ opponent: OPPONENTS[stage], meta: current, onEnd: Tournament.onEnd });
      },
      onEnd: function(res){
        const t = loadT();
        const stage = current.stage;
        const isLast = stage >= OPPONENTS.length - 1;
        if (res.win) {
          t.beaten[OPPONENTS[stage].id] = (t.beaten[OPPONENTS[stage].id] || 0) + 1;
          if (!isLast) t.bestStage = Math.max(t.bestStage, stage + 1);
          else t.cleared = true;
          saveT(t);
        }
        $("rankVal").textContent = res.win ? (isLast ? "優勝！" : "WIN") : "LOSE";
        const box = $("resultBtns");
        box.innerHTML = "";
        if (res.win && !isLast) {
          box.appendChild(btn("bigBtn", "次の相手: " + OPPONENTS[stage + 1].name, function(){ Tournament.start(stage + 1); }));
        } else {
          box.appendChild(btn("bigBtn", res.win ? "もう一度" : "再挑戦", function(){ Tournament.start(stage); }));
        }
        box.appendChild(btn("ghostBtn", "対戦相手一覧へ", function(){ paintLadder(); show("ladder"); }));
      },
    };

    const RALLY_GAME_ID = "tennis";   // Firestore の leaderboard/{gameId}
    const Rally = {
      start: function(){
        current = { mode:"rally", stage:null };
        Sfx.unlock();
        TennisGame.begin({ opponent: RALLY_MACHINE, meta: current, onEnd: Rally.onEnd });
      },
      onEnd: function(res){
        const rec = Scores.submit(RALLY_GAME_ID, res.score, { hits: res.hits, maxCombo: res.maxCombo,
          perfects: res.perfects, char: selectedChar });
        $("resultBest").textContent = rec.isNew
          ? "自己ベスト更新！"
          : ("自己ベスト " + rec.rec.score);
        const box = $("resultBtns");
        box.innerHTML = "";
        box.appendChild(btn("bigBtn", "もう一度", function(){ Rally.start(); }));
        box.appendChild(btn("ghostBtn", "モード選択へ", function(){ paintModes(); show("modes"); }));
        // Firestore のTOP10。上限(ルール側10万点)に合わせて丸めて送る
        RankUI.show(RALLY_GAME_ID, Math.min(res.score, 100000),
          { hits: res.hits, maxCombo: res.maxCombo, char: selectedChar });
      },
    };

    function paintLadder(){
      const t = loadT();
      const box = $("ladderList");
      box.innerHTML = "";
      OPPONENTS.forEach(function(o, i){
        const locked = i > t.bestStage;
        const beatenN = t.beaten[o.id] || 0;
        const row = document.createElement("div");
        row.className = "ladderRow" + (locked ? " locked" : "") + (beatenN ? " beaten" : "");
        row.dataset.stage = String(i);
        const img = document.createElement("div");
        img.className = "ladderArt";
        renderCharInto(img, opponentChar(o.char, selectedChar).id, "idle");
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = '<div class="name">' + (i + 1) + '. ' + (locked ? "???" : o.name) + '</div>' +
          '<div class="desc">' + (locked ? "前の相手に勝つと挑戦できる" : o.desc) + '</div>' +
          (beatenN ? '<div class="state">勝利 ' + beatenN + '回</div>' : "");
        row.appendChild(img); row.appendChild(info);
        if (!locked) row.appendChild(btn("fightBtn", "挑戦", function(){ Tournament.start(i); }));
        box.appendChild(row);
      });
    }
    function paintModes(){
      const t = loadT();
      $("modeTournamentBest").textContent = t.cleared ? "優勝済み！ 全員に勝った"
        : (t.bestStage > 0 ? "到達: " + (t.bestStage + 1) + "人目 / " + OPPONENTS.length + "人" : "");
      const best = Scores.get(RALLY_GAME_ID);
      $("modeRallyBest").textContent = best ? ("自己ベスト " + best.score) : "";
    }
    return { Tournament, Rally, paintLadder, paintModes, loadTournament: loadT, resetTournament: resetT,
      rallyGameId: RALLY_GAME_ID, current: function(){ return current; } };
  })();

  /* =========================================================
     12. 実績画面の描画
     ========================================================= */
  function paintAchievements(){
    $("achTitle").textContent = "実績 " + Progress.countText();
    const list = $("achList");
    list.innerHTML = "";
    Progress.ACHIEVEMENTS.forEach(function(a){
      const got = Progress.has(a.id);
      const row = document.createElement("div");
      row.className = "achRow " + (got ? "got" : "locked");
      row.dataset.ach = a.id;
      row.innerHTML = '<span class="mark">' + (got ? "★" : "・") + '</span>' +
        '<span><span class="name">' + a.name + '</span><br><span class="desc">' + a.desc + '</span></span>';
      list.appendChild(row);
    });
    paintChips("courtChips", Progress.COURTS, "court");
    paintChips("ballChips", Progress.BALLS, "ball");
  }
  function paintChips(boxId, items, kind){
    const box = $(boxId);
    const equipped = Progress.load().equipped[kind];
    box.innerHTML = "";
    items.forEach(function(item){
      const ok = Progress.unlocked(item);
      const b = document.createElement("button");
      b.className = "chip" + (equipped === item.id ? " on" : "");
      b.dataset.id = item.id;
      b.textContent = ok ? item.name : (item.name + " 🔒");
      if (!ok) b.disabled = true;
      else b.addEventListener("click", function(){ Progress.equip(kind, item.id); paintAchievements(); });
      box.appendChild(b);
    });
  }
  function paintAchButton(){ $("achBtn").textContent = "実績 " + Progress.countText(); }

  /* =========================================================
     13. 画面の行き来
     ========================================================= */
  $("startBtn").addEventListener("click", function(){ Sfx.unlock(); Modes.paintModes(); show("modes"); });
  $("achBtn").addEventListener("click", function(){ paintAchievements(); show("achievements"); });
  $("achBack").addEventListener("click", function(){ paintAchButton(); show("title"); });
  $("modeTournament").addEventListener("click", function(){ Modes.paintLadder(); show("ladder"); });
  $("modeRally").addEventListener("click", function(){ Modes.Rally.start(); });
  $("modesBack").addEventListener("click", function(){ paintAchButton(); show("title"); });
  $("ladderBack").addEventListener("click", function(){ Modes.paintModes(); show("modes"); });

  paintCharRow();
  paintAchButton();
  Progress.applyEquipped();
  show("title");

  // Playwright検証用
  window.__tennis = {
    begin: TennisGame.begin, swing: TennisGame.swing, applyCourse: TennisGame.applyCourse,
    forceCourse: TennisGame.forceCourse, debugState: TennisGame.debugState,
    startMode: function(mode, opts){
      opts = opts || {};
      if (mode === "tournament") Modes.Tournament.start(opts.stage || 0, !!opts.force);
      else if (mode === "rally") Modes.Rally.start();
    },
    tournament: { load: Modes.loadTournament, reset: Modes.resetTournament },
    scores: { get: function(){ return Scores.get(Modes.rallyGameId); },
      reset: function(){ Scores.reset(Modes.rallyGameId); } },
    progress: { load: Progress.load, reset: Progress.reset, grant: Progress.grant,
      equip: Progress.equip, repaint: function(){ paintAchievements(); paintAchButton(); } },
    rallyPoints: rallyPoints, rampFor: rampFor,
    opponents: OPPONENTS,
    setRng: setRng, scoreLabels: scoreLabels, sfx: Sfx,
  };
})();
</script>
